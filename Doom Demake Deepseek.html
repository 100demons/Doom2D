/* Layout: one screen. The 16:10 game canvas is centred and letterboxed on the
   Mars-rock ground colour; a single strip underneath lists browser-only keys. */
:root {
  color-scheme: dark;
  --ground: #100a0a;      /* C_BG from the game */
  --void: #000000;
  --frame: #6e5028;       /* HUD panel border */
  --ink: #f0e6d2;         /* HUD text */
  --dim: #8c8264;         /* "[ P ] SWITCH" hint colour */
  --brass: #ffc83c;       /* "PRESS ENTER" yellow */
  --display: "FreeSansBold", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--display);
  overflow: hidden;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  place-items: center;
}
#stage:fullscreen { background: var(--void); }
#screen {
  display: block;
  background: var(--void);
  box-shadow: 0 0 0 1px var(--frame), 0 18px 48px rgba(0, 0, 0, 0.55);
  outline: none;
  touch-action: none;
}
#stage:fullscreen #screen { box-shadow: none; }
#focus-hint {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 14px 6px;
  background: rgba(0, 0, 0, 0.78);
  border: 2px solid var(--frame);
  color: var(--brass);
  font: 700 13px/1.2 var(--display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}
#bar {
  flex: none;
  min-height: 34px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  column-gap: 22px;
  row-gap: 2px;
  padding-block: 4px;
  font: 700 11px/1.3 var(--display);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
}
#bar kbd {
  font: inherit;
  color: var(--ink);
  border: 1px solid var(--frame);
  padding: 1px 5px 0;
  margin-right: 6px;
}
</style>

// ============================================================

    this.mt = new Uint32Array(624);
    this.mti = 625;
    this.seed(seed === undefined ? 0 : seed);

  initGenrand(s) {
    const mt = this.mt;

  initByArray(key) {
    this.initGenrand(19650218);
    const mt = this.mt, N = 624;

// math.hypot exactly as CPython 3.12+ computes it (correctly rounded

}

  const max = a > b ? a : b;
  if (max === 0) return 0;
  const e = _expOf(max);
  if (e < -1021 || e > 1022) return Math.hypot(a, b);

// ============================================================
//  RECT  (pygame.Rect semantics for integer rects)
// ============================================================
class Rect {
  constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
  get left() { return this.x; }
  set left(v) { this.x = v; }
  get top() { return this.y; }
  set top(v) { this.y = v; }
  get right() { return this.x + this.w; }
  set right(v) { this.x = v - this.w; }
  get bottom() { return this.y + this.h; }
  set bottom(v) { this.y = v - this.h; }
  get centerx() { return this.x + (this.w >> 1); }
  get centery() { return this.y + (this.h >> 1); }
  setCenter(cx, cy) { this.x = cx - (this.w >> 1); this.y = cy - (this.h >> 1); }
  copy() { return new Rect(this.x, this.y, this.w, this.h); }
  colliderect(o) {
    if (this.w === 0 || this.h === 0 || o.w === 0 || o.h === 0) return false;
    return this.x < o.x + o.w && this.y < o.y + o.h &&
           this.x + this.w > o.x && this.y + this.h > o.y;
  }
  collidepoint(px, py) {
    px = trunc(px); py = trunc(py);
    return px >= this.x && px < this.x + this.w && py >= this.y && py < this.y + this.h;
  }
}

// ============================================================
//  LEVEL
// ============================================================
class Level {
  constructor(w, h, solid, lava, spawn, exitRect, entitySpawns, itemSpawns, roverSpawns) {
    this.w = w;
    this.h = h;
    this.solid = solid;
    this.lava = lava;
    this.rects = [];
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) row.push(new Rect(x * TILE, y * TILE, TILE, TILE));
      this.rects.push(row);
    }
    this.spawn = spawn;
    this.exitRect = exitRect;
    this.entitySpawns = entitySpawns;
    this.itemSpawns = itemSpawns;
    this.roverSpawns = roverSpawns || [];
    this.pixelW = w * TILE;
    this.pixelH = h * TILE;
  }
  isSolid(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return true;
    return this.solid[ty][tx];
  }
  isLava(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return false;
    return this.lava[ty][tx];
  }
  tilesOverlapping(rect) {
    const x0 = Math.max(0, Math.floor(rect.x / TILE));
    const x1 = Math.min(this.w - 1, Math.floor((rect.x + rect.w) / TILE));
    const y0 = Math.max(0, Math.floor(rect.y / TILE));
    const y1 = Math.min(this.h - 1, Math.floor((rect.y + rect.h) / TILE));
    const out = [];
    for (let ty = y0; ty <= y1; ty++) {
      const srow = this.solid[ty];
      for (let tx = x0; tx <= x1; tx++) if (srow[tx]) out.push(this.rects[ty][tx]);
    }
    return out;
  }
  lavaOverlapping(rect) {
    const x0 = Math.max(0, Math.floor(rect.x / TILE));
    const x1 = Math.min(this.w - 1, Math.floor((rect.x + rect.w) / TILE));
    const y0 = Math.max(0, Math.floor(rect.y / TILE));
    const y1 = Math.min(this.h - 1, Math.floor((rect.y + rect.h) / TILE));
    for (let ty = y0; ty <= y1; ty++) {
      const lrow = this.lava[ty];
      for (let tx = x0; tx <= x1; tx++) if (lrow[tx]) return true;
    }
    return false;
  }
}

// ============================================================
//  PROCEDURAL LEVEL GENERATOR
//  Enemy distribution ramps up with difficulty.
// ============================================================
function generateLevelData(index, rng) {
  const W = GEN_W, H = GEN_H;
  const d = index / (TOTAL_LEVELS - 1);

  const solid = [], lava = [];
  for (let y = 0; y < H; y++) {
    solid.push(new Array(W).fill(true));
    lava.push(new Array(W).fill(false));
  }

  // ---------------- ground profile ----------------
  const ground = new Array(W).fill(H - 5);
  let g = H - 6;
  let x = 1;
  while (x < W - 1) {
    const seg = rng.randint(4, 12);
    for (let i = 0; i < seg; i++) if (x + i < W - 1) ground[x + i] = g;
    x += seg;
    g += rng.choice([-2, -1, 0, 0, 1, 2]);
    g = Math.max(14, Math.min(H - 4, g));
  }
  ground[0] = ground[1];
  ground[W - 1] = ground[W - 2];

  // ---------------- ceiling profile ----------------
  const ceil = new Array(W).fill(2);
  let c = 3;
  x = 1;
  while (x < W - 1) {
    const seg = rng.randint(8, 22);
    for (let i = 0; i < seg; i++) if (x + i < W - 1) ceil[x + i] = c;
    x += seg;
    c += rng.choice([-1, 0, 0, 1]);
    c = Math.max(1, Math.min(5, c));
  }
  ceil[0] = ceil[1];
  ceil[W - 1] = ceil[W - 2];

  for (let cx = 0; cx < W; cx++) {
    if (ground[cx] - ceil[cx] < 10) ceil[cx] = Math.max(1, ground[cx] - 10);
  }

  // ---------------- carve ----------------
  for (let cx = 0; cx < W; cx++) {
    for (let y = ceil[cx] + 1; y < ground[cx]; y++) solid[y][cx] = false;
  }
  for (let y = 0; y < H; y++) { solid[y][0] = true; solid[y][W - 1] = true; }
  for (let cx = 0; cx < W; cx++) { solid[0][cx] = true; solid[H - 1][cx] = true; }

  // ---------------- lava pits ----------------
  const lavaZone = new Array(W).fill(false);
  const nPools = 2 + trunc(d * 9);
  const maxPw = 2 + Math.min(2, trunc(d * 3.0));
  let pools = 0, tries = 0;
  while (pools < nPools && tries < 600) {
    tries += 1;
    const pw = rng.randint(2, maxPw);
    const px = rng.randint(10, W - 12);
    if (px + pw >= W - 8) continue;
    const gy = ground[px];
    let bad = false;
    for (let i = 0; i < pw; i++) if (ground[px + i] !== gy) { bad = true; break; }
    if (bad) continue;
    const j0 = Math.max(0, px - 5), j1 = Math.min(W, px + pw + 5);
    for (let j = j0; j < j1; j++) if (lavaZone[j]) { bad = true; break; }
    if (bad) continue;
    for (let i = 0; i < pw; i++) {
      const cx = px + i;
      for (let dy = 0; dy < 3; dy++) {
        const yy = gy + dy;
        if (0 < yy && yy < H - 1) { solid[yy][cx] = false; lava[yy][cx] = false; }
      }
      const by = gy + 2;
      if (0 < by && by < H - 1) lava[by][cx] = true;
    }
    for (let j = j0; j < j1; j++) lavaZone[j] = true;
    pools += 1;
  }

  // ---------------- floating platforms ----------------
  const nPlat = 8 + trunc(d * 22);
  for (let n = 0; n < nPlat; n++) {
    const pw = rng.randint(3, 7);
    if (W - pw - 12 <= 10) break;
    const px = rng.randint(10, W - pw - 12);
    let top = -Infinity, gmin = Infinity, anyLava = false;
    for (let i = 0; i < pw; i++) {
      top = Math.max(top, ceil[px + i]);
      gmin = Math.min(gmin, ground[px + i]);
      if (lavaZone[px + i]) anyLava = true;
    }
    top += 2;
    let bot = gmin - 3;
    if (anyLava) bot = Math.min(bot, gmin - 6);
    if (bot <= top) continue;
    const py = rng.randint(top, bot);
    for (let i = 0; i < pw; i++) {
      const cx = px + i;
      if (ceil[cx] < py && py < ground[cx]) solid[py][cx] = true;
    }
  }

  // ---------------- items ----------------
  const itemSpawns = [];
  const usedCols = new Set();
  const placeItem = (kind, minx = 10, maxx = W - 12) => {
    for (let t = 0; t < 140; t++) {
      const ex = rng.randint(minx, maxx);
      if (usedCols.has(ex)) continue;
      if (lavaZone[ex]) continue;
      const gy = ground[ex];
      if (gy - 1 <= ceil[ex] + 1) continue;
      if (solid[gy - 1][ex] || lava[gy - 1][ex]) continue;
      if (lava[gy][ex]) continue;
      usedCols.add(ex);
      itemSpawns.push([kind, ex * TILE, (gy - 1) * TILE]);
      return true;
    }
    return false;
  };

  const nH = 1 + trunc(d * 4);
  for (let i = 0; i < nH; i++) placeItem('H');
  const nA = 1 + trunc(d * 4);
  for (let i = 0; i < nA; i++) placeItem('A');
  if (index === 1) placeItem('J', 12, 44);
  if (index === 2) placeItem('G', 12, 44);
  if (index >= 3 && rng.random() < 0.30) placeItem(rng.choice(['H', 'A', 'H']));

  // ---------------- enemies ----------------
  const entitySpawns = [];
  const nEnemies = 3 + trunc(d * 16);

  const cacChance    = d < 0.30 ? 0.0 : 0.05 + d * 0.15;
  const impChance    = d < 0.10 ? 0.0 : 0.10 + d * 0.08;
  const shotChance   = 0.06 + d * 0.09;
  const pinkyChance  = d < 0.18 ? 0.0 : 0.06 + d * 0.10;
  const lostChance   = d < 0.22 ? 0.0 : 0.05 + d * 0.09;
  const knightChance = d < 0.35 ? 0.0 : 0.06 + d * 0.09;

  for (let n = 0; n < nEnemies; n++) {
    for (let t = 0; t < 50; t++) {
      const ex = rng.randint(14, W - 10);
      if (lavaZone[ex]) continue;
      const gy = ground[ex];
      const r = rng.random();
      let acc = 0.0;

      acc += cacChance;
      if (r < acc) {
        const ey = rng.randint(ceil[ex] + 2, Math.max(ceil[ex] + 3, gy - 5));
        entitySpawns.push(['C', ex * TILE, ey * TILE]);
        break;
      }
      acc += impChance;
      if (r < acc) { entitySpawns.push(['I', ex * TILE, (gy - 1) * TILE]); break; }
      acc += shotChance;
      if (r < acc) { entitySpawns.push(['S', ex * TILE, (gy - 1) * TILE]); break; }
      acc += pinkyChance;
      if (r < acc) { entitySpawns.push(['P', ex * TILE, (gy - 1) * TILE]); break; }
      acc += knightChance;
      if (r < acc) { entitySpawns.push(['K', ex * TILE, (gy - 1) * TILE]); break; }
      acc += lostChance;
      if (r < acc) {
        const ey = rng.randint(ceil[ex] + 2, Math.max(ceil[ex] + 3, gy - 5));
        entitySpawns.push(['L', ex * TILE, ey * TILE]);
        break;
      }
      // fallback -> zombie
      entitySpawns.push(['Z', ex * TILE, (gy - 1) * TILE]);
      break;
    }
  }

  // ---------------- spawn ----------------
  const spawnCol = 3;
  for (let cx = spawnCol - 1; cx < spawnCol + 4; cx++) {
    for (let cy = Math.max(1, ground[cx] - 5); cy < ground[cx]; cy++) {
      solid[cy][cx] = false;
      lava[cy][cx] = false;
    }
  }
  const spawn = [spawnCol * TILE + 5, ground[spawnCol] * TILE - 34];

  // ---------------- exit ----------------
  let exitCol = W - 5;
  for (let t = 0; t < 14; t++) {
    if (!lavaZone[exitCol] && (ground[exitCol] - 1 > ceil[exitCol] + 1)) break;
    exitCol -= 1;
  }
  const ey = ground[exitCol] - 1;
  solid[ey][exitCol] = false;
  lava[ey][exitCol] = false;
  if (ey - 1 > 0) solid[ey - 1][exitCol] = false;
  const exitRect = new Rect(exitCol * TILE, ey * TILE, TILE, TILE);

  // ---------------- rovers (only in later levels) ----------------
  const roverSpawns = [];
  if (index >= 6 && rng.random() < 0.55) {
    let attempts = 0;
    while (attempts < 120) {
      attempts += 1;
      const rx = rng.randint(20, W - 20);
      if (lavaZone[rx]) continue;
      const gy = ground[rx];
      if (gy - 3 <= ceil[rx]) continue;
      if (ground[rx - 1] !== gy || ground[rx] !== gy || ground[rx + 1] !== gy) continue;
      let nearLava = false;
      for (let i = -2; i <= 2; i++) if (lavaZone[rx + i]) { nearLava = true; break; }
      if (nearLava) continue;
      if (Math.abs(rx - spawnCol) < 12) continue;
      if (Math.abs(rx - exitCol) < 8) continue;
      roverSpawns.push([rx * TILE - 12, (gy - 1) * TILE]);
      break;
    }
  }

  return new Level(W, H, solid, lava, spawn, exitRect, entitySpawns, itemSpawns, roverSpawns);
}

// ============================================================
//  THE OVERSEER ARENA
//  One giant hand-built room: flat arena floor, ceiling pillars
//  for cover and a handful of platforms to break line of sight.
//  The boss is the only entity that spawns; it grows its own arms.
// ============================================================
function generateBossArena(rng) {
  const W = GEN_W, H = GEN_H;
  const solid = [], lava = [];
  for (let y = 0; y < H; y++) {
    solid.push(new Array(W).fill(true));
    lava.push(new Array(W).fill(false));
  }

  const floorY = 26;    // solid ground starts here
  const ceilY = 5;      // first open row

  // carve the single big room
  for (let x = 2; x <= W - 3; x++) {
    for (let y = ceilY; y < floorY; y++) solid[y][x] = false;
  }

  // pillars hanging down from the ceiling (cover + break LOS)
  for (const px of [16, 34, 52, 70, 88, 106]) {
    for (let x = px; x < px + 2; x++) {
      for (let y = ceilY; y < ceilY + 4; y++) solid[y][x] = true;
    }
  }

  // floating platforms (jump cover / railgun perches)
  const plats = [[22, 19, 8], [44, 17, 8], [62, 19, 10], [82, 17, 8], [102, 19, 8]];
  for (const [px, py, pw] of plats) {
    for (let x = px; x < px + pw; x++) {
      if (x > 2 && x < W - 3) solid[py][x] = true;
    }
  }

  const spawnCol = 4;
  const spawn = [spawnCol * TILE + 5, floorY * TILE - 34];

  const exitCol = W - 5;
  const exitRect = new Rect(exitCol * TILE, (floorY - 1) * TILE, TILE, TILE);

  // supply caches spread across the arena
  const itemSpawns = [];
  const spots = [10, 24, 38, 55, 72, 90, 108, 116];
  for (let i = 0; i < spots.length; i++) {
    const kind = i % 3 === 0 ? 'H' : 'A';
    itemSpawns.push([kind, spots[i] * TILE, (floorY - 1) * TILE]);
  }

  // THE OVERSEER — the head itself. Its two arms are spawned at runtime.
  const entitySpawns = [['B', 86 * TILE, (floorY - 1) * TILE]];

  return new Level(W, H, solid, lava, spawn, exitRect, entitySpawns, itemSpawns, []);
}

// ============================================================
//  HELPERS
// ============================================================
function moveAndCollide(rect, vx, vy, level) {
  let onGround = false;
  rect.x += pyRound(vx);
  for (const t of level.tilesOverlapping(rect)) {
    if (rect.colliderect(t)) {
      if (vx > 0) rect.right = t.left;
      else if (vx < 0) rect.left = t.right;
      vx = 0.0;
    }
  }
  rect.y += pyRound(vy);
  for (const t of level.tilesOverlapping(rect)) {
    if (rect.colliderect(t)) {
      if (vy > 0) { rect.bottom = t.top; onGround = true; }
      else if (vy < 0) { rect.top = t.bottom; }
      vy = 0.0;
    }
  }
  return [vx, vy, onGround];
}

function lineOfSight(level, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = pyHypot(dx, dy);
  if (dist < 1.0) return true;
  const steps = trunc(dist / 14.0) + 1;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const px = x1 + dx * t, py = y1 + dy * t;
    if (level.isSolid(Math.floor(px / TILE), Math.floor(py / TILE))) return false;
  }
  return true;
}

function raycastWall(level, x1, y1, ang, maxdist) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let d = 0.0;
  const step = 6.0;
  while (d < maxdist) {
    d += step;
    const px = x1 + dx * d, py = y1 + dy * d;
    if (level.isSolid(Math.floor(px / TILE), Math.floor(py / TILE))) return [px, py];
  }
  return [x1 + dx * maxdist, y1 + dy * maxdist];
}

// ============================================================
//  PROCEDURAL BACKGROUND TEXTURE  (pixel-exact pygame raster)
// ============================================================
function makeBgTexturePixels(size) {
  const px = new Uint8ClampedArray(size * size * 4);
  const put = (x, y, c) => {
    if (x < 0 || y < 0 || x >= size || y >= size) return;
    const i = (y * size + x) * 4;
    px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
  };
  const hline = (x1, y, x2, c) => { for (let x = x1; x <= x2; x++) put(x, y, c); };
  // pygame 2 draw_circle_filled
  const circle = (x0, y0, radius, c) => {
    let f = 1 - radius, ddFx = 0, ddFy = -2 * radius, x = 0, y = radius;
    while (x < y) {
      if (f >= 0) { y--; ddFy += 2; f += ddFy; }
      x++; ddFx += 2; f += ddFx + 1;
      if (f >= 0) {
        hline(x0 - x, y0 + y - 1, x0 + x - 1, c);
        hline(x0 - x, y0 - y, x0 + x - 1, c);
      }
      hline(x0 - y, y0 + x - 1, x0 + y - 1, c);
      hline(x0 - y, y0 - x, x0 + y - 1, c);
    }
  };
  // pygame 2.6 clip_line (Liang-Barsky on the surface clip rect)
  const clipLine = (x1, y1, x2, y2) => {
    const p1 = x1 - x2, p2 = -p1, p3 = y1 - y2, p4 = -p3;
    const q1 = x1, q2 = size - x1, q3 = y1, q4 = size - y1;
    let nmax = 0, pmin = 1, r1, r2;
    if ((p1 === 0 && q1 < 0) || (p2 === 0 && q2 < 0) || (p3 === 0 && q3 < 0) || (p4 === 0 && q4 < 0)) return null;
    if (p1) {
      r1 = q1 / p1; r2 = q2 / p2;
      if (p1 < 0) { if (r1 > nmax) nmax = r1; if (r2 < pmin) pmin = r2; }
      else { if (r2 > nmax) nmax = r2; if (r1 < pmin) pmin = r1; }
    }
    if (p3) {
      r1 = q3 / p3; r2 = q4 / p4;
      if (p3 < 0) { if (r1 > nmax) nmax = r1; if (r2 < pmin) pmin = r2; }
      else { if (r2 > nmax) nmax = r2; if (r1 < pmin) pmin = r1; }
    }
    if (nmax > pmin) return null;
    const rnd = (v) => trunc(v < 0 ? v - 0.5 : v + 0.5);
    return [x1 + rnd(p2 * nmax), y1 + rnd(p4 * nmax), x1 + rnd(p2 * pmin), y1 + rnd(p4 * pmin)];
  };
  // pygame 2 draw_line (Bresenham, 1px) on the clipped segment
  const line = (ox1, oy1, ox2, oy2, c) => {
    const cl = clipLine(ox1, oy1, ox2, oy2);
    if (!cl) return;
    let [x1, y1, x2, y2] = cl;
    if (x1 === x2 && y1 === y2) { put(x1, y1, c); return; }
    if (y1 === y2) { hline(Math.min(x1, x2), y1, Math.max(x1, x2), c); return; }
    if (x1 === x2) { for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) put(x1, y, c); return; }
    const dx = Math.abs(x2 - x1), sx = x1 < x2 ? 1 : -1;
    const dy = Math.abs(y2 - y1), sy = y1 < y2 ? 1 : -1;
    let err = trunc((dx > dy ? dx : -dy) / 2);
    while (x1 !== x2 || y1 !== y2) {
      put(x1, y1, c);
      const e2 = err;
      if (e2 > -dx) { err -= dy; x1 += sx; }
      if (e2 < dy) { err += dx; y1 += sy; }
    }
    put(x2, y2, c);
  };

  for (let i = 0; i < size * size; i++) {
    px[i * 4] = 18; px[i * 4 + 1] = 11; px[i * 4 + 2] = 10; px[i * 4 + 3] = 255;
  }
  const rng = new PyRandom(1337);
  // dark blotches (craters)
  for (let n = 0; n < 30; n++) {
    const cxp = rng.randint(0, size);
    const cyp = rng.randint(0, size);
    const r = rng.randint(8, 28);
    const col = [rng.randint(8, 16), rng.randint(4, 9), rng.randint(3, 8)];
    circle(cxp, cyp, r, col);
  }
  // speckle noise
  for (let n = 0; n < size * 3; n++) {
    const x = rng.randint(0, size - 1);
    const y = rng.randint(0, size - 1);
    const v = rng.randint(20, 42);
    put(x, y, [v, v >> 1, trunc(v / 3)]);
  }
  // faint lava cracks
  for (let n = 0; n < 18; n++) {
    const x = rng.randint(0, size - 1);
    const y = rng.randint(0, size - 1);
    const ang = rng.uniform(0, TAU);
    const ln = rng.randint(8, 26);
    const ex = x + Math.cos(ang) * ln;
    const ey = y + Math.sin(ang) * ln;
    line(x, y, trunc(ex), trunc(ey), [40, 12, 8]);
  }
  return px;
}

// ============================================================
//  GFX  -  pygame.draw look-alikes on a Canvas 2D context.
// ============================================================
const FONT_FAMILY = '"FreeSansBold", "Helvetica Neue", Helvetica, Arial, sans-serif';
// pygame.font.Font(None, n) renders freesansbold at int(n * 0.6875) px.
const FONTS = {
  s:  { px: 15, ascent: 12 },   // Font(None, 22)
  m:  { px: 22, ascent: 18 },   // Font(None, 32)
  l:  { px: 42, ascent: 34 },   // Font(None, 62)
  xl: { px: 71, ascent: 57 },   // Font(None, 104)
};
for (const k in FONTS) FONTS[k].css = `bold ${FONTS[k].px}px ${FONT_FAMILY}`;

class Gfx {
  constructor(ctx) {
    this.ctx = ctx;
    this.bg = null;           // background texture canvas
    this.batches = new Map(); // tile batching: css -> flat [x,y,w,h,...]
  }

  fill(c) {
    const x = this.ctx;
    x.fillStyle = rgb(c);
    x.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }

  rect(c, X, Y, W, H) {
    if (W <= 0 || H <= 0) return;
    const x = this.ctx;
    x.fillStyle = rgb(c);
    x.fillRect(X, Y, W, H);
  }

  // pygame >= 2.1.1: border is drawn inside the rect
  rectOutline(c, X, Y, W, H, w) {
    if (W <= 0 || H <= 0) return;
    if (w * 2 >= W || w * 2 >= H) { this.rect(c, X, Y, W, H); return; }
    const x = this.ctx;
    x.fillStyle = rgb(c);
    x.fillRect(X, Y, W, w);
    x.fillRect(X, Y + H - w, W, w);
    x.fillRect(X, Y + w, w, H - 2 * w);
    x.fillRect(X + W - w, Y + w, w, H - 2 * w);
  }

  roundRect(c, X, Y, W, H, r) {
    if (W <= 0 || H <= 0) return;
    r = Math.max(0, Math.min(r, W / 2, H / 2));
    const x = this.ctx;
    x.fillStyle = rgb(c);
    x.beginPath();
    x.moveTo(X + r, Y);
    x.lineTo(X + W - r, Y);
    x.arcTo(X + W, Y, X + W, Y + r, r);
    x.lineTo(X + W, Y + H - r);
    x.arcTo(X + W, Y + H, X + W - r, Y + H, r);
    x.lineTo(X + r, Y + H);
    x.arcTo(X, Y + H, X, Y + H - r, r);
    x.lineTo(X, Y + r);
    x.arcTo(X, Y, X + r, Y, r);
    x.closePath();
    x.fill();
  }

  // pygame 2 filled circle: diameter 2r centred on the pixel corner (cx, cy)
  circle(c, cx, cy, r) {
    if (r < 1) return;
    const x = this.ctx;
    x.fillStyle = rgb(c);
    x.beginPath();
    x.arc(trunc(cx), trunc(cy), r, 0, TAU);
    x.fill();
  }

  ellipse(c, X, Y, W, H) {
    if (W <= 0 || H <= 0) return;
    const x = this.ctx;
    x.fillStyle = rgb(c);
    x.beginPath();
    x.ellipse(X + W / 2, Y + H / 2, W / 2, H / 2, 0, 0, TAU);
    x.fill();
  }

  // pygame fills polygons including their edge pixels
  polygon(c, pts) {
    const x = this.ctx;
    const col = rgb(c);
    x.fillStyle = col;
    x.strokeStyle = col;
    x.lineWidth = 1;
    x.lineJoin = 'round';
    x.beginPath();
    x.moveTo(pts[0][0] + 0.5, pts[0][1] + 0.5);
    for (let i = 1; i < pts.length; i++) x.lineTo(pts[i][0] + 0.5, pts[i][1] + 0.5);
    x.closePath();
    x.fill();
    x.stroke();
  }

  // pygame thick lines grow along x (steep lines) or y (shallow lines)
  // so their ends are flat and axis-aligned.
  line(c, x0, y0, x1, y1, width) {
    if (width < 1) return;
    x0 = trunc(x0); y0 = trunc(y0); x1 = trunc(x1); y1 = trunc(y1);
    const x = this.ctx;
    x.fillStyle = rgb(c);
    const half = width >> 1, extra = 1 - (width % 2);
    const lo = -half + extra, hi = half + 1;
    const dx = x1 - x0, dy = y1 - y0;
    if (Math.abs(dx) <= Math.abs(dy)) {
      if (dy === 0) { x.fillRect(x0 + lo, y0, hi - lo, 1); return; }
      let ax = x0, ay = y0, bx = x1, by = y1;
      if (ay > by) { ax = x1; ay = y1; bx = x0; by = y0; }
      if (dx === 0) { x.fillRect(ax + lo, ay, hi - lo, by - ay + 1); return; }
      x.beginPath();
      x.moveTo(ax + lo, ay);
      x.lineTo(ax + hi, ay);
      x.lineTo(bx + hi, by + 1);
      x.lineTo(bx + lo, by + 1);
      x.closePath();
      x.fill();
    } else {
      let ax = x0, ay = y0, bx = x1, by = y1;
      if (ax > bx) { ax = x1; ay = y1; bx = x0; by = y0; }
      if (dy === 0) { x.fillRect(ax, ay + lo, bx - ax + 1, hi - lo); return; }
      x.beginPath();
      x.moveTo(ax, ay + lo);
      x.lineTo(ax, ay + hi);
      x.lineTo(bx + 1, by + hi);
      x.lineTo(bx + 1, by + lo);
      x.closePath();
      x.fill();
    }
  }

  // pygame.draw.arc: angles in radians, counter-clockwise.
  arc(c, X, Y, W, H, a0, a1, width) {
    if (width > (W >> 1) || width > (H >> 1)) width = Math.max(W >> 1, H >> 1);
    if (a1 < a0) a1 += TAU;
    width = Math.min(width, Math.min(W, H) >> 1);
    if (width < 1) return;
    const cx = X + (W >> 1), cy = Y + (H >> 1), rx = W >> 1, ry = H >> 1;
    const x = this.ctx;
    x.strokeStyle = rgb(c);
    x.lineWidth = 1;
    x.lineCap = 'butt';
    x.beginPath();
    const ring = (ex, ey, erx, ery) => {
      if (erx <= 0 || ery <= 0) return;
      x.moveTo(ex + Math.cos(a0) * erx, ey - Math.sin(a0) * ery);
      x.ellipse(ex, ey, erx, ery, 0, -a0, -a1, true);
    };
    if (width === 1) ring(cx, cy, rx, ry);
    else {
      for (let loop = 0; loop < width; loop++) {
        ring(cx - 1, cy - 1, rx - loop - 1, ry - loop - 1);
        ring(cx, cy, rx - loop, ry - loop);
      }
    }
    x.stroke();
  }

  alphaRect(r, g, b, a, X, Y, W, H) {
    const x = this.ctx;
    x.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (a / 255) + ')';
    x.fillRect(X, Y, W, H);
  }

  // Draws like surf.blit(font.render(s), (X, Y)): Y is the top of the text box.
  text(f, s, c, X, Y) {
    const x = this.ctx, F = FONTS[f];
    x.font = F.css;
    x.textBaseline = 'alphabetic';
    x.textAlign = 'left';
    x.fillStyle = rgb(c);
    x.fillText(s, X, Y + F.ascent);
  }

  textWidth(f, s) {
    const x = this.ctx;
    x.font = FONTS[f].css;
    return Math.round(x.measureText(s).width);
  }

  // ---- pixel-art sprite: chunky grid of coloured squares ----
  spriteSize(key) {
    const s = SPRITES[key];
    return [s.rows[0].length * s.sc, s.rows.length * s.sc];
  }

  sprite(key, X, Y, flipX) {
    const s = SPRITES[key];
    if (!s) return;
    X = trunc(X); Y = trunc(Y);
    const sc = s.sc, ctx = this.ctx;
    const groups = new Map();
    for (let r = 0; r < s.rows.length; r++) {
      const row = s.rows[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.' || ch === ' ') continue;
        const col = s.pal[ch];
        if (!col) continue;
        let arr = groups.get(col);
        if (!arr) { arr = []; groups.set(col, arr); }
        const cc = flipX ? (row.length - 1 - c) : c;
        arr.push(X + cc * sc, Y + r * sc);
      }
    }
    for (const [col, arr] of groups) {
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let i = 0; i < arr.length; i += 2) ctx.rect(arr[i], arr[i + 1], sc, sc);
      ctx.fill();
    }
  }

  // ---- background texture (built from exact pixels) ----
  setBackground(pixels, size) {
    if (typeof document === 'undefined') { this.bg = { width: size, height: size }; return; }
    const cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    const cx = cv.getContext('2d');
    const img = cx.createImageData(size, size);
    img.data.set(pixels);
    cx.putImageData(img, 0, 0);
    this.bg = cv;
  }

  blitBg(X, Y) {
    const x = this.ctx;
    x.imageSmoothingEnabled = false;
    x.drawImage(this.bg, X, Y);
  }

  // ---- batched rect fills (tile layer) ----
  batchRect(css, X, Y, W, H) {
    let b = this.batches.get(css);
    if (!b) { b = []; this.batches.set(css, b); }
    b.push(X, Y, W, H);
  }
  flushBatch(css) {
    const b = this.batches.get(css);
    if (!b || b.length === 0) return;
    const x = this.ctx;
    x.fillStyle = css;
    x.beginPath();
    for (let i = 0; i < b.length; i += 4) x.rect(b[i], b[i + 1], b[i + 2], b[i + 3]);
    x.fill();
    b.length = 0;
  }
}

//  ITEM
// ============================================================
class Item {
  constructor(kind, x, y) {
    this.kind = kind;
    this.rect = new Rect(x + 4, y + 6, 24, 26);
    this.bob = R.random() * 6.283;
  }
  update() { this.bob += 0.07; }
  draw(g, cx, cy) {
    const r = this.rect.copy();
    r.x -= cx;
    r.y -= cy + trunc(Math.sin(this.bob) * 4);
    if (this.kind === 'J') {
      g.roundRect([120, 120, 130], r.x + 6, r.y + 4, 12, 16, 4);
      g.rect([200, 150, 40], r.x + 8, r.y + 18, 8, 6);
      g.polygon([255, 160, 40], [[r.x + 12, r.y + 22], [r.x + 6, r.y + 30], [r.x + 18, r.y + 30]]);
      g.circle([255, 220, 120], r.x + 12, r.y + 10, 3);
    } else if (this.kind === 'G') {
      g.rect([90, 90, 100], r.x + 10, r.y + 10, 5, 14);
      g.arc([190, 190, 200], r.x + 4, r.y + 0, 16, 16, 0.6, 5.6, 3);
      g.circle([220, 220, 60], r.x + 12, r.y + 6, 3);
    } else if (this.kind === 'H') {
      g.roundRect([240, 240, 240], r.x + 4, r.y + 6, 16, 16, 3);
      g.rect([200, 30, 30], r.x + 10, r.y + 9, 4, 10);
      g.rect([200, 30, 30], r.x + 7, r.y + 12, 10, 4);
    } else if (this.kind === 'A') {
      g.rect([150, 30, 30], r.x + 2, r.y + 8, 8, 14);
      g.rect([150, 30, 30], r.x + 12, r.y + 8, 8, 14);
      g.rect([220, 180, 60], r.x + 3, r.y + 12, 6, 3);
      g.rect([220, 180, 60], r.x + 13, r.y + 12, 6, 3);
    }
  }
}

//  ENEMY
//  Kinds:
//    'Z' zombie      - ground, hitscan pistol
//    'I' imp         - ground, slow fireball
//    'C' cacodemon   - flying, slow fireball, orbits
//    'S' shotgunner  - ground, heavy hitscan
//    'P' pinky       - ground, fast melee rusher
//    'L' lost soul   - flying, homing suicide rusher
//    'K' hell knight - ground, fast green fireballs
//    'B' THE OVERSEER - level 27 only: one giant head. Only hits on the
//                       head itself hurt it; the arms are separate.
//    'H' Overseer arm - level 27 only: killable turret that fires a laser
//                       at random intervals. Destroying it does not hurt
//                       the head, and is entirely optional.
// ============================================================
class Enemy {
  constructor(kind, x, y) {
    this.kind = kind;
    this.hurt = 0;
    this.dead = false;
    this.anim = R.random() * 10.0;
    this.vx = 0.0;
    this.vy = 0.0;
    this.onGround = false;
    this.shootCd = R.randint(40, 130);
    this.growlCd = R.randint(60, 260);
    this.meleeCd = 0;
    this.spawnCd = 300;
    this.face = -1;
    // --- imperfect aiming (ranged enemies) ---
    this.aimX = null;
    this.aimY = null;
    this.reaction = R.randint(16, 34);
    // --- boss / arm state ---
    this.boss = null;
    this.side = 0;
    this.handsSpawned = false;
    this.charge = 0;
    this.beam = 0;
    this.beamCd = R.randint(60, 220);
    this.beamFrom = null;
    this.beamEnd = null;
    this.beamHitCd = 0;
    if (kind === 'Z') {
      this.rect = new Rect(x + 5, y + TILE - 34, 22, 34);
      this.hp = 30; this.speed = 1.05; this.flying = false; this.color = [72, 96, 62];
    } else if (kind === 'I') {
      this.rect = new Rect(x + 3, y + TILE - 36, 26, 36);
      this.hp = 48; this.speed = 1.35; this.flying = false; this.color = [128, 62, 40];
    } else if (kind === 'C') {
      this.rect = new Rect(x - 6, y + TILE - 46, 44, 44);
      this.hp = 140; this.speed = 1.5; this.flying = true; this.color = [150, 54, 54];
    } else if (kind === 'S') {
      this.rect = new Rect(x + 4, y + TILE - 36, 24, 36);
      this.hp = 65; this.speed = 1.15; this.flying = false; this.color = [150, 110, 60];
    } else if (kind === 'P') {
      this.rect = new Rect(x + 1, y + TILE - 34, 30, 34);
      this.hp = 95; this.speed = 2.7; this.flying = false; this.color = [210, 90, 130];
    } else if (kind === 'L') {
      this.rect = new Rect(x + 4, y + TILE - 32, 24, 32);
      this.hp = 40; this.speed = 4.2; this.flying = true; this.color = [235, 130, 40];
    } else if (kind === 'K') {
      this.rect = new Rect(x + 1, y + TILE - 48, 34, 48);
      this.hp = 130; this.speed = 1.25; this.flying = false; this.color = [100, 140, 90];
    } else if (kind === 'H') {
      this.rect = new Rect(x - 16, y - 16, 32, 32);
      this.hp = 200; this.speed = 2.0; this.flying = true; this.color = [170, 60, 60];
    } else { // 'B' THE OVERSEER (giant head)
      this.rect = new Rect(x - 30, y + TILE - 120, 104, 120);
      this.hp = 1800; this.speed = 0.9; this.flying = false; this.color = [150, 30, 30];
    }
    this.maxhp = this.hp;
  }

  // ------------------------------------------------------
  //  Single entry point for taking damage. Returns true if the hit
  //  landed. The Overseer's head is the only part of it that exists,
  //  so every hit on this rect hurts it; the arms are other enemies.
  // ------------------------------------------------------
  hitAt(game, x, y, dmg, count) {
    if (this.dead) return false;
    this.hp -= dmg;
    this.hurt = 4;
    game.spawnBurst(x, y, C_BLOOD, count || 3);
    if (this.hp <= 0) game.killEnemy(this);
    return true;
  }

  // ------------------------------------------------------
  hitscanPlayer(game, ang, dmg, color) {
    const ex = this.rect.centerx, ey = this.rect.centery;
    const [hx, hy] = raycastWall(game.level, ex, ey, ang, 900);
    game.tracers.push([ex, ey, hx, hy, 6, color]);
    const p = game.player;
    const total = pyHypot(hx - ex, hy - ey);
    if (total < 1) return;
    const steps = trunc(total / 10.0) + 1;
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      const sx = ex + (hx - ex) * t, sy = ey + (hy - ey) * t;
      if (p.hitbox().collidepoint(sx, sy)) {
        p.damage(dmg, game);
        game.spawnBurst(sx, sy, C_BLOOD, 6);
        return;
      }
    }
  }

  shootAtPlayer(game) {
    const p = game.player;
    const px = p.rect.centerx, py = p.rect.centery;
    const ex = this.rect.centerx, ey = this.rect.centery;
    const k = this.kind;
    if (k === 'Z' || k === 'S') {
      const tx = this.aimX === null ? px : this.aimX;
      const ty = this.aimY === null ? py : this.aimY;
      let ang = Math.atan2(ty - ey, tx - ex);
      if (k === 'Z') {
        ang += R.uniform(-0.038, 0.038);
        this.hitscanPlayer(game, ang, 9, [255, 220, 120]);
      } else {
        ang += R.uniform(-0.024, 0.024);
        this.hitscanPlayer(game, ang, 15, [255, 170, 100]);
      }
      game.play('shotgun');
      return;
    }
    let ang = Math.atan2(py - ey, px - ex);
    if (k === 'I') {
      const sp = 4.4;
      game.ebullets.push(new Bullet(ex, ey, Math.cos(ang) * sp, Math.sin(ang) * sp, 14, true));
      game.play('grunt');
    } else if (k === 'K') {
      const sp = 6.0;
      game.ebullets.push(new Bullet(ex, ey, Math.cos(ang) * sp, Math.sin(ang) * sp, 22, true, [90, 255, 100]));
      game.play('grunt');
    } else if (k === 'C') {
      const sp = 3.8;
      game.ebullets.push(new Bullet(ex, ey, Math.cos(ang) * sp, Math.sin(ang) * sp, 17, true));
      game.play('grunt');
    } else if (k === 'B') {
      for (const da of [-0.36, -0.18, 0.0, 0.18, 0.36]) {
        const a = ang + da;
        const sp = 6.2;
        game.ebullets.push(new Bullet(ex, ey, Math.cos(a) * sp, Math.sin(a) * sp, 16, true, [120, 255, 80]));
      }
      game.play('grunt');
    }
  }

  // ------------------------------------------------------
  //  Overseer arm: hovers beside the head, telegraphs a laser with a
  //  thin warning line, then fires a thick beam along it. Beam timing
  //  is randomised so the arms never settle into a rhythm.
  // ------------------------------------------------------
  updateHand(game) {
    const p = game.player;
    const b = this.boss;
    this.anim += 0.12;
    if (this.hurt > 0) this.hurt -= 1;
    if (this.beamHitCd > 0) this.beamHitCd -= 1;

    if (b === null || b.dead || game.enemies.indexOf(b) < 0) {
      const i = game.enemies.indexOf(this);
      if (i >= 0) game.enemies.splice(i, 1);
      this.dead = true;
      game.spawnBurst(this.rect.centerx, this.rect.centery, [255, 140, 60], 14);
      return;
    }

    // drift back into position beside the boss unless mid-laser
    if (this.charge <= 0 && this.beam <= 0) {
      const tx = b.rect.centerx + this.side * 108;
      const ty = b.rect.top + 40 + Math.sin(this.anim * 1.5 + this.side * 2) * 12;
      this.rect.x += (tx - this.rect.centerx) * 0.08;
      this.rect.y += (ty - this.rect.centery) * 0.08;
    }

    const ex = this.rect.centerx, ey = this.rect.centery;
    const px = p.rect.centerx, py = p.rect.centery;
    const dist = pyHypot(px - ex, py - ey);
    const los = lineOfSight(game.level, ex, ey, px, py);

    if (this.charge > 0) {
      this.charge -= 1;
      if (this.charge === 0) {
        this.beam = 16;
        this.beamHitCd = 0;
        game.play('grunt');
        game.shake = Math.max(game.shake, 4);
      }
    } else if (this.beam > 0) {
      this.beam -= 1;
      if (this.beamHitCd <= 0 && this.beamFrom !== null && this.beamEnd !== null) {
        const x1 = this.beamFrom[0], y1 = this.beamFrom[1];
        const x2 = this.beamEnd[0], y2 = this.beamEnd[1];
        const total = pyHypot(x2 - x1, y2 - y1);
        const steps = trunc(total / 9.0) + 1;
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const sx = x1 + (x2 - x1) * t;
          const sy = y1 + (y2 - y1) * t;
          if (p.hitbox().collidepoint(sx, sy)) {
            p.damage(11, game);
            game.spawnBurst(sx, sy, [255, 140, 80], 5);
            this.beamHitCd = 14;
            break;
          }
        }
      }
      if (this.beam === 0) { this.beamFrom = null; this.beamEnd = null; }
    } else {
      this.beamCd -= 1;
      if (this.beamCd <= 0 && los && dist < 1000) {
        // lock the aim now: the warning line shows exactly where it will fire
        const ang = Math.atan2(py - ey, px - ex);
        const [wx, wy] = raycastWall(game.level, ex, ey, ang, 1600);
        this.beamFrom = [ex, ey];
        this.beamEnd = [wx, wy];
        this.charge = 42;
        this.beamCd = R.randint(150, 380);
      }
    }
    this.face = px > ex ? 1 : -1;
  }

  // ------------------------------------------------------
  update(game) {
    if (this.kind === 'H') { this.updateHand(game); return; }

    const level = game.level;
    const p = game.player;
    this.anim += 0.12;
    if (this.hurt > 0) this.hurt -= 1;
    if (this.meleeCd > 0) this.meleeCd -= 1;

    // the Overseer grows a pair of arms on its first update
    if (this.kind === 'B' && !this.handsSpawned) {
      this.handsSpawned = true;
      const hL = new Enemy('H', this.rect.centerx - 110, this.rect.top + 40);
      hL.side = -1; hL.boss = this;
      const hR = new Enemy('H', this.rect.centerx + 110, this.rect.top + 40);
      hR.side = 1; hR.boss = this;
      game.enemies.push(hL, hR);
    }

    const dx = p.rect.centerx - this.rect.centerx;
    const dy = p.rect.centery - this.rect.centery;
    const dist = pyHypot(dx, dy);
    const los = lineOfSight(level, this.rect.centerx, this.rect.centery, p.rect.centerx, p.rect.centery);

    this.growlCd -= 1;
    if (this.growlCd <= 0) {
      this.growlCd = R.randint(180, 480);
      if (dist < 620) game.play('grunt');
    }

    // ---------------- movement ----------------
    if (this.kind === 'L') {
      // lost soul: homing charge
      if (dist > 1) {
        this.vx += (dx / dist) * 0.30;
        this.vy += (dy / dist) * 0.30;
      }
      this.vx *= 0.96;
      this.vy *= 0.96;
      const sp = pyHypot(this.vx, this.vy);
      if (sp > 5.0) {
        this.vx = this.vx / sp * 5.0;
        this.vy = this.vy / sp * 5.0;
      }
      const nx = this.rect.x + pyRound(this.vx);
      const ny = this.rect.y + pyRound(this.vy);
      const probe = new Rect(nx, ny, this.rect.w, this.rect.h);
      if (!level.tilesOverlapping(probe).some(t => probe.colliderect(t))) {
        this.rect.x = nx;
        this.rect.y = ny;
      } else {
        this.vx *= -0.4;
        this.vy *= -0.4;
      }
    } else if (this.flying) { // cacodemon
      const tx = p.rect.centerx - 180 * (dx > 0 ? 1 : -1);
      const ty = p.rect.centery - 90;
      const mx = tx - this.rect.centerx;
      const my = ty - this.rect.centery;
      const m = pyHypot(mx, my);
      if (m > 4) {
        this.vx += (mx / m) * 0.16;
        this.vy += (my / m) * 0.14;
      }
      this.vx *= 0.94;
      this.vy *= 0.94;
      this.vy += Math.sin(this.anim * 1.7) * 0.06;
      if (this.vx > 3.2) this.vx = 3.2;
      if (this.vx < -3.2) this.vx = -3.2;
      if (this.vy > 3.0) this.vy = 3.0;
      if (this.vy < -3.0) this.vy = -3.0;
      const nx = this.rect.x + pyRound(this.vx);
      const ny = this.rect.y + pyRound(this.vy);
      const probe = new Rect(nx, ny, this.rect.w, this.rect.h);
      if (!level.tilesOverlapping(probe).some(t => probe.colliderect(t))) {
        this.rect.x = nx;
        this.rect.y = ny;
      } else {
        this.vx *= -0.5;
        this.vy *= -0.5;
      }
    } else {
      // ground movement
      this.vy += GRAVITY;
      if (this.vy > MAX_FALL) this.vy = MAX_FALL;
      let want;
      if (this.kind === 'P') {
        want = dx > 0 ? this.speed : -this.speed;      // pinky always charges
      } else if (this.kind === 'B') {
        want = dist > 260 ? (dx > 0 ? this.speed : -this.speed) : 0.0;
      } else {
        if (dist < 460 && los) want = dx > 0 ? this.speed : -this.speed;
        else if (dist < 240) want = dx > 0 ? -this.speed : this.speed;
        else want = 0.0;
      }
      this.vx += (want - this.vx) * 0.18;
      [this.vx, this.vy, this.onGround] = moveAndCollide(this.rect, this.vx, this.vy, level);
      if (this.onGround && Math.abs(this.vx) < 0.4 && dist < 500 && los) {
        if (R.random() < 0.02) this.vy = -9.0;
      }
    }

    this.face = dx > 0 ? 1 : -1;

    // ---------------- contact damage ----------------
    if (this.meleeCd <= 0 && this.rect.colliderect(p.hitbox()) && !p.dead) {
      if (this.kind === 'P') {
        p.damage(18, game);
        p.vx += dx > 0 ? 9 : -9;
        p.vy = -5;
        this.meleeCd = 40;
        game.shake = Math.max(game.shake, 5);
      } else if (this.kind === 'L') {
        p.damage(12, game);
        this.hp = 0;
        game.spawnBurst(this.rect.centerx, this.rect.centery, [255, 180, 60], 14);
        game.killEnemy(this);
        return;
      } else if (this.kind === 'B') {
        p.damage(24, game);
        p.vx += dx > 0 ? 12 : -12;
        p.vy = -6;
        this.meleeCd = 50;
        game.shake = Math.max(game.shake, 9);
      }
    }

    // ---------------- lava ----------------
    if (level.lavaOverlapping(this.rect)) {
      this.hp -= 2;
      if (this.hp <= 0) {
        game.killEnemy(this);
        return;
      }
    }

    // ---------------- aiming & shooting ----------------
    if (this.kind === 'Z' || this.kind === 'S') {
      if (this.aimX === null) { this.aimX = p.rect.centerx; this.aimY = p.rect.centery; }
      const rate = this.kind === 'S' ? 0.30 : 0.22;
      this.aimX += (p.rect.centerx - this.aimX) * rate;
      this.aimY += (p.rect.centery - this.aimY) * rate;
    }
    if (!los) this.reaction = 20;
    else if (this.reaction > 0) this.reaction -= 1;

    this.shootCd -= 1;
    if (this.shootCd <= 0 && this.reaction <= 0 && los && dist < 700) {
      this.shootAtPlayer(game);
      const k = this.kind;
      if (k === 'Z') this.shootCd = R.randint(75, 130);
      else if (k === 'I') this.shootCd = R.randint(95, 160);
      else if (k === 'C') this.shootCd = R.randint(70, 120);
      else if (k === 'S') this.shootCd = R.randint(95, 155);
      else if (k === 'K') this.shootCd = R.randint(85, 140);
      else if (k === 'B') this.shootCd = R.randint(110, 170);
      this.reaction = R.randint(10, 26);
    }

    // ---------------- boss summon ----------------
    if (this.kind === 'B') {
      this.spawnCd -= 1;
      if (this.spawnCd <= 0) {
        this.spawnCd = 420;
        for (let i = 0; i < 2; i++) {
          const nL = new Enemy('L', 0, 0);
          nL.rect.x = this.rect.centerx + R.randint(-140, 140);
          nL.rect.y = this.rect.top + R.randint(-20, 40);
          game.enemies.push(nL);
        }
        game.play('grunt');
      }
    }
  }

  // ------------------------------------------------------
  draw(g, cx, cy) {
    const r = this.rect.copy();
    r.x -= cx;
    r.y -= cy;
    const flash = this.hurt > 0;
    const k = this.kind;
    let fb = null;                      // hurt-flash bounding box

    if (k === 'Z') {
      const [sw, sh] = g.spriteSize('Z');
      const sx = r.centerx - (sw >> 1), sy = r.bottom - sh;
      g.sprite('Z', sx, sy);
      g.rect(C_GUN, r.centerx + this.face * 6, sy + 18, 12, 4);
      fb = [sx, sy, sw, sh];

    } else if (k === 'I') {
      const [sw, sh] = g.spriteSize('I');
      const sx = r.centerx - (sw >> 1), sy = r.bottom - sh;
      g.sprite('I', sx, sy);
      g.circle([255, 150, 40], r.centerx + this.face * 10, sy + 22, 4);
      g.circle([255, 230, 140], r.centerx + this.face * 10, sy + 22, 2);
      fb = [sx, sy, sw, sh];

    } else if (k === 'C') {
      const bob = trunc(Math.sin(this.anim) * 3);
      const [sw, sh] = g.spriteSize('C');
      const sx = r.centerx - (sw >> 1);
      const sy = r.centery - (sh >> 1) + bob;
      for (let i = 0; i < 6; i++) {
        const a = i * (Math.PI * 2 / 6) + this.anim * 0.3;
        const px = r.centerx + Math.cos(a) * (sw >> 1);
        const py = r.centery + bob + Math.sin(a) * (sh >> 1);
        g.rect([110, 30, 30], trunc(px) - 3, trunc(py) - 3, 6, 6);
      }
      g.sprite('C', sx, sy);
      fb = [sx, sy, sw, sh];

    } else if (k === 'S') {
      // shotgunner: armored soldier with a heavy shotgun (unchanged look)
      const body = flash ? [255, 255, 255] : this.color;
      g.rect(body, r.x, r.y + 12, r.w, r.h - 12);
      const head = flash ? [240, 200, 160] : [180, 140, 100];
      g.rect(head, r.x + 2, r.y, r.w - 4, 14);
      g.rect([70, 50, 30], r.x + 2, r.y + 13, r.w, 6);
      g.rect([200, 60, 40], r.x + (r.w >> 1) - 2, r.y + 1, 4, 6);     // helmet stripe
      const gx = r.centerx + this.face * 10;                          // shotgun
      g.rect([110, 110, 120], gx - 6, r.y + 16, 22, 5);
      g.rect([60, 60, 66], gx - 6, r.y + 16, 6, 5);
      g.rect([50, 40, 30], r.x + 3, r.y + r.h - 6, 6, 6);             // legs
      g.rect([50, 40, 30], r.x + r.w - 9, r.y + r.h - 6, 6, 6);

    } else if (k === 'P') {
      const bob = trunc(Math.sin(this.anim * 2.0) * 2);
      const [sw, sh] = g.spriteSize('P');
      const sx = r.centerx - (sw >> 1), sy = r.bottom - sh + bob;
      g.sprite('P', sx, sy);
      fb = [sx, sy, sw, sh];

    } else if (k === 'L') {
      const bob = trunc(Math.sin(this.anim * 4.0) * 2);
      const [sw, sh] = g.spriteSize('L');
      const sx = r.centerx - (sw >> 1), sy = r.centery - (sh >> 1) + bob;
      for (let i = 0; i < 6; i++) {
        const a = i * (Math.PI * 2 / 6) + this.anim * 1.6;
        const fx = r.centerx + Math.cos(a) * (sw >> 1) + 2;
        const fy = r.centery + bob + Math.sin(a) * (sh >> 1);
        g.rect([255, 160, 40], trunc(fx) - 2, trunc(fy) - 2, 5, 5);
      }
      g.sprite('L', sx, sy);
      fb = [sx, sy, sw, sh];

    } else if (k === 'K') {
      const [sw, sh] = g.spriteSize('K');
      const sx = r.centerx - (sw >> 1), sy = r.bottom - sh;
      g.sprite('K', sx, sy);
      fb = [sx, sy, sw, sh];

    } else if (k === 'H') {
      const [sw, sh] = g.spriteSize('H');
      const sx = r.centerx - (sw >> 1), sy = r.centery - (sh >> 1);
      // energy tether back to the head while it lives
      if (this.boss !== null && this.boss.hp > 0 && !this.boss.dead) {
        const bx = this.boss.rect.centerx - cx + this.side * 24;
        const by = this.boss.rect.centery - cy;
        g.line([120, 30, 20], bx, by, r.centerx, r.centery, 5);
        g.circle([170, 50, 30], bx, by, 4);
      }
      // telegraphed beam: thin warning line, then the full beam
      if (this.charge > 0 && this.beamFrom !== null && this.beamEnd !== null) {
        g.line([255, 90, 60],
               this.beamFrom[0] - cx, this.beamFrom[1] - cy,
               this.beamEnd[0] - cx, this.beamEnd[1] - cy, 1);
      }
      if (this.beam > 0 && this.beamFrom !== null && this.beamEnd !== null) {
        const x1 = this.beamFrom[0] - cx, y1 = this.beamFrom[1] - cy;
        const x2 = this.beamEnd[0] - cx, y2 = this.beamEnd[1] - cy;
        g.line([120, 20, 20], x1, y1, x2, y2, 13);
        g.line([255, 60, 40], x1, y1, x2, y2, 7);
        g.line([255, 220, 180], x1, y1, x2, y2, 3);
      }
      g.sprite('H', sx, sy, this.side < 0);
      if (this.charge > 0) {
        const rad = 5 + trunc((42 - this.charge) * 0.55);
        g.circle([255, 120, 80], r.centerx, r.centery, rad);
        g.circle([255, 240, 200], r.centerx, r.centery, Math.max(2, rad - 4));
      }
      fb = [sx, sy, sw, sh];
      // arm health bar
      if (this.hp < this.maxhp) {
        const bw = sw + 8, bx = r.centerx - (bw >> 1), by = sy - 9;
        g.rect([40, 0, 0], bx, by, bw, 5);
        g.rect([230, 90, 60], bx, by, trunc(bw * Math.max(0, this.hp / this.maxhp)), 5);
        g.rectOutline([120, 60, 40], bx, by, bw, 5, 1);
      }

    } else { // 'B' THE OVERSEER (giant head)
      const [sw, sh] = g.spriteSize('B');
      const bob = -trunc(Math.abs(Math.sin(this.anim * 0.8)) * 3);
      const sx = r.centerx - (sw >> 1), sy = r.bottom - sh + bob;
      g.sprite('B', sx, sy);
      fb = [sx, sy, sw, sh];
    }

    if (flash && fb !== null) g.alphaRect(255, 255, 255, 120, fb[0], fb[1], fb[2], fb[3]);
  }
}

// ============================================================
//  BULLET (enemy projectile, colored per type)
// ============================================================
class Bullet {
  constructor(x, y, vx, vy, dmg, hostile, color = null) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.dmg = dmg;
    this.hostile = hostile;
    this.dead = false;
    this.life = 240;
    this.anim = 0.0;
    this.color = color;
  }
  update(game) {
    this.anim += 0.35;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 1;
    if (this.life <= 0) { this.dead = true; return; }
    const rect = new Rect(trunc(this.x) - 7, trunc(this.y) - 7, 14, 14);
    const tx = Math.floor(this.x / TILE), ty = Math.floor(this.y / TILE);
    if (game.level.isSolid(tx, ty)) {
      this.dead = true;
      game.spawnBurst(this.x, this.y, [255, 150, 40], 8);
      return;
    }
    if (game.level.isLava(tx, ty)) {
      this.dead = true;
      game.spawnBurst(this.x, this.y, [255, 150, 40], 6);
      return;
    }
    if (this.hostile) {
      if (rect.colliderect(game.player.hitbox())) {
        game.player.damage(this.dmg, game);
        game.spawnBurst(this.x, this.y, [255, 120, 40], 8);
        this.dead = true;
      }
    }
  }
  draw(g, cx, cy) {
    const px = trunc(this.x) - cx;
    const py = trunc(this.y) - cy;
    const r = trunc(8 + Math.sin(this.anim) * 2);
    let outer, inner;
    if (this.color) {
      outer = this.color;
      inner = this.color.map(c => Math.max(0, c - 120));
    } else {
      outer = [255, 210, 90];
      inner = [255, 110, 20];
    }
    g.circle(outer, px, py, r);
    g.circle(inner, px, py, Math.max(1, r - 4));
  }
}

// ============================================================
//  PLAYER SHOT  (grenades arc and explode; plasma bolts fly straight)
// ============================================================
class PlayerShot {
  constructor(x, y, vx, vy, cfg) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.kind = cfg.kind;              // 'grenade' | 'plasma'
    this.dmg = cfg.dmg;
    this.blast = cfg.blast || 0;
    this.life = cfg.life || 90;
    this.gravity = cfg.gravity || 0;
    this.dead = false;
    this.anim = 0;
  }
  update(game) {
    this.anim += 0.35;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 1;
    if (this.life <= 0) { this.detonate(game); return; }
    const tx = Math.floor(this.x / TILE), ty = Math.floor(this.y / TILE);
    if (game.level.isSolid(tx, ty) || game.level.isLava(tx, ty)) { this.detonate(game); return; }
    const r = new Rect(trunc(this.x) - 6, trunc(this.y) - 6, 12, 12);
    for (const e of game.enemies.slice()) {
      if (e.dead) continue;
      if (r.colliderect(e.rect)) {
        if (this.kind === 'plasma') {
          e.hitAt(game, this.x, this.y, this.dmg, 4);
          game.spawnBurst(this.x, this.y, [140, 200, 255], 5);
          this.dead = true;
          return;
        }
        this.detonate(game);
        return;
      }
    }
    if (this.y > game.level.pixelH + 300) this.dead = true;
  }
  detonate(game) {
    if (this.dead) return;
    this.dead = true;
    if (this.kind === 'grenade') game.explode(this.x, this.y, this.blast, this.dmg);
    else game.spawnBurst(this.x, this.y, [140, 200, 255], 5);
  }
  draw(g, cx, cy) {
    const px = trunc(this.x) - cx, py = trunc(this.y) - cy;
    if (this.kind === 'grenade') {
      g.circle([40, 60, 40], px, py, 6);
      g.circle([110, 150, 80], px, py, 4);
      g.circle([200, 230, 120], px - 2, py - 2, 2);
    } else {
      const r = 6 + trunc(Math.sin(this.anim) * 1.5);
      g.circle([90, 150, 255], px, py, r + 2);
      g.circle([200, 235, 255], px, py, r);
      g.circle([255, 255, 255], px, py, Math.max(1, r - 3));
    }
  }
}

// ============================================================
//  PLAYER
// ============================================================
class Player {
  constructor(x, y) {
    this.rect = new Rect(x, y, 22, 34);
    this.vx = 0.0;
    this.vy = 0.0;
    this.onGround = false;
    this.health = 100;
    this.ammo = 30;
    this.fuel = 100.0;
    this.maxFuel = 100.0;
    this.hasJet = false;
    this.hasHook = false;
    this.cooldown = 0;
    this.grapple = null;
    this.ropeLen = 0.0;
    this.hurtFlash = 0;
    this.lavaCd = 0;
    this.walkAnim = 0.0;
    this.dead = false;
    this.jetSfx = 0;
    this.facing = 1;
    this.vehicle = null;          // Rover reference when driving

    this.weapons = ['shotgun', 'club'];
    this.currentWeapon = 0;
    this.kills = 0;
    this.clubUpgraded = false;

    this.reloadTimer = 0;
    this.reloadMax = 18;
    this.meleeAnim = 0;
    this.meleeCd = 0;
    this.muzzleFlash = 0;
  }

  currentWeaponId() { return this.weapons[this.currentWeapon]; }

  currentWeaponName() {
    const w = this.currentWeaponId();
    if (w === 'club') return this.clubUpgraded ? 'CHAINSAW' : 'CLUB';
    return WEAPON_NAMES[w] || String(w).toUpperCase();
  }

  switchWeapon(game) {
    if (this.weapons.length <= 1) return;
    this.currentWeapon = (this.currentWeapon + 1) % this.weapons.length;
    this.reloadTimer = 0;
    this.meleeAnim = 0;
    this.cooldown = Math.max(this.cooldown, 6);
    game.play('reload');
    game.msg = 'WIELDING  ' + this.currentWeaponName();
    game.msgTimer = 90;
  }

  unlockWeapon(wid, game) {
    if (!this.weapons.includes(wid)) this.weapons.push(wid);
  }

  registerKill(game) {
    this.kills += 1;
    if (!this.clubUpgraded && this.kills >= 50) {
      this.clubUpgraded = true;
      game.msg = 'CLUB  UPGRADED  TO  CHAINSAW  -  PRESS  P';
      game.msgTimer = 200;
      game.play('chainsaw');
    }
  }

  // ------------------------------------------------------
  //  Vehicle helpers
  // ------------------------------------------------------
  hitbox() {
    if (this.vehicle !== null && !this.vehicle.exploded) return this.vehicle.rect;
    return this.rect;
  }

  toggleVehicle(game) {
    if (this.dead) return;
    if (this.vehicle !== null) this.exitVehicle(game);
    else this.enterVehicle(game);
  }

  enterVehicle(game) {
    let best = null, bestD = 90.0;
    for (const r of game.rovers) {
      if (r.exploded) continue;
      const d = pyHypot(r.rect.centerx - this.rect.centerx, r.rect.centery - this.rect.centery);
      if (d < bestD) { bestD = d; best = r; }
    }
    if (best === null) return;
    this.vehicle = best;
    best.playerInside = true;
    this.vx = 0.0;
    this.vy = 0.0;
    this.grapple = null;
    this.rect.setCenter(best.rect.centerx, best.rect.centery);
    game.play('pickup');
    game.msg = 'ENTERED  ROVER  -  PRESS  E  TO  EXIT';
    game.msgTimer = 140;
  }

  exitVehicle(game) {
    const rover = this.vehicle;
    if (rover === null) return;
    this.vehicle = null;
    rover.playerInside = false;
    const w = this.rect.w, h = this.rect.h;
    const candidates = [
      [rover.rect.centerx - (w >> 1), rover.rect.top - h - 1],
      [rover.rect.centerx - (w >> 1), rover.rect.bottom - h],
      [rover.rect.right + 2, rover.rect.centery - (h >> 1)],
      [rover.rect.left - w - 2, rover.rect.centery - (h >> 1)],
    ];
    for (const [x, y] of candidates) {
      const test = new Rect(x, y, w, h);
      if (!game.level.tilesOverlapping(test).some(t => test.colliderect(t))) {
        this.rect.x = x;
        this.rect.y = y;
        this.vx = 0.0;
        this.vy = 0.0;
        this.onGround = false;
        game.msg = 'EXITED  ROVER';
        game.msgTimer = 90;
        return;
      }
    }
    // no room, restore - player stays in the rover
    this.vehicle = rover;
    rover.playerInside = true;
    game.msg = 'NO  ROOM  TO  EXIT';
    game.msgTimer = 90;
  }

  // ------------------------------------------------------
  damage(amount, game) {
    if (this.dead) return;
    if (this.vehicle !== null && !this.vehicle.exploded) {
      this.vehicle.damage(amount, game);
      return;
    }
    this.health -= amount;
    this.hurtFlash = 10;
    game.play('hurt');
    game.shake = Math.max(game.shake, 6);
    if (this.health <= 0) {
      this.health = 0;
      this.dead = true;
      game.play('boom');
    }
  }

  fireWeapon(game, aimAng) {
    const w = this.currentWeaponId();
    if (w === 'club') this.meleeAttack(game, aimAng);
    else if (w === 'supershotgun') this.fireSupershotgun(game, aimAng);
    else if (w === 'grenade') this.fireGrenade(game, aimAng);
    else if (w === 'railgun') this.fireRailgun(game, aimAng);
    else if (w === 'plasma') this.firePlasma(game, aimAng);
    else if (w === 'minigun') this.fireMinigun(game, aimAng);
    else this.fireShotgun(game, aimAng);
  }

  ejectShell(game, aimAng) {
    const back = aimAng + Math.PI + R.uniform(-0.45, 0.45);
    const sp = R.uniform(2.2, 3.6);
    const sx = this.rect.centerx + Math.cos(aimAng) * 20;
    const sy = this.rect.centery + Math.sin(aimAng) * 20;
    game.spawnParticle(sx, sy, Math.cos(back) * sp, Math.sin(back) * sp - 2.2, 32, C_BRASS, 3);
    for (let i = 0; i < 2; i++) {
      const a = R.uniform(0, TAU);
      game.spawnParticle(sx, sy, Math.cos(a) * 0.7, Math.sin(a) * 0.7 - 0.6, 14, [180, 180, 170], 2);
    }
  }

  firePellets(game, ox, oy, aimAng, count, spread, range, dmg, tracerLife, tracerColor) {
    for (let i = 0; i < count; i++) {
      const ang = aimAng + R.uniform(-spread, spread);
      const [hx, hy] = raycastWall(game.level, ox, oy, ang, range);
      game.tracers.push([ox, oy, hx, hy, tracerLife, tracerColor]);
      const steps = trunc(pyHypot(hx - ox, hy - oy) / 8.0) + 1;
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        const sx = ox + (hx - ox) * t;
        const sy = oy + (hy - oy) * t;
        let hit = false;
        for (const e of game.enemies) {
          if (e.rect.collidepoint(sx, sy)) {
            e.hitAt(game, sx, sy, dmg, 3);
            hit = true;
            break;
          }
        }
        if (hit) break;
      }
    }
  }

  fireShotgun(game, aimAng) {
    if (this.cooldown > 0 || this.reloadTimer > 0) return;
    if (this.ammo <= 0) {
      game.play('click');
      this.cooldown = 12;
      return;
    }
    this.ammo -= 1;
    this.cooldown = 28;
    this.reloadTimer = this.reloadMax;
    this.muzzleFlash = 6;
    game.play('shotgun');
    game.shake = Math.max(game.shake, 8);

    const ox = this.rect.centerx + Math.cos(aimAng) * 22;
    const oy = this.rect.centery + Math.sin(aimAng) * 22;
    this.firePellets(game, ox, oy, aimAng, 7, 0.17, 620, 10, 5, [255, 235, 140]);
    for (let i = 0; i < 10; i++) {
      const a = aimAng + R.uniform(-0.3, 0.3);
      const sp = R.uniform(2, 6);
      game.spawnParticle(ox, oy, Math.cos(a) * sp, Math.sin(a) * sp, 16, [255, 200, 90], 3);
    }
    this.ejectShell(game, aimAng);
  }

  fireSupershotgun(game, aimAng) {
    if (this.cooldown > 0 || this.reloadTimer > 0) return;
    if (this.ammo < 2) {
      game.play('click');
      this.cooldown = 12;
      return;
    }
    this.ammo -= 2;
    this.cooldown = 46;
    this.reloadTimer = 26;
    this.muzzleFlash = 9;
    game.play('ssg');
    game.shake = Math.max(game.shake, 13);

    const ox = this.rect.centerx + Math.cos(aimAng) * 22;
    const oy = this.rect.centery + Math.sin(aimAng) * 22;
    this.firePellets(game, ox, oy, aimAng, 14, 0.26, 540, 12, 6, [255, 220, 130]);
    for (let i = 0; i < 18; i++) {
      const a = aimAng + R.uniform(-0.42, 0.42);
      const sp = R.uniform(2, 7);
      game.spawnParticle(ox, oy, Math.cos(a) * sp, Math.sin(a) * sp, 18, [255, 210, 110], 3);
    }
    this.ejectShell(game, aimAng);
    this.ejectShell(game, aimAng);
  }

  // ------------------------------------------------------
  //  GRENADE LAUNCHER: lobs an arcing bomb that detonates with a
  //  large radius, damaging every enemy caught in the blast.
  // ------------------------------------------------------
  fireGrenade(game, aimAng) {
    if (this.cooldown > 0 || this.reloadTimer > 0) return;
    if (this.ammo < 2) {
      game.play('click');
      this.cooldown = 12;
      return;
    }
    this.ammo -= 2;
    this.cooldown = 40;
    this.reloadTimer = 22;
    this.muzzleFlash = 6;
    game.play('grenade');
    game.shake = Math.max(game.shake, 6);

    const ox = this.rect.centerx + Math.cos(aimAng) * 24;
    const oy = this.rect.centery + Math.sin(aimAng) * 24;
    const sp = 9.5;
    game.pshots.push(new PlayerShot(ox, oy, Math.cos(aimAng) * sp, Math.sin(aimAng) * sp, {
      kind: 'grenade', dmg: 75, blast: 78, life: 130, gravity: 0.34,
    }));
  }

  // ------------------------------------------------------
  //  RAILGUN: a piercing hitscan slug. Every enemy on the line takes
  //  full damage; the beam stops only at a wall.
  // ------------------------------------------------------
  fireRailgun(game, aimAng) {
    if (this.cooldown > 0 || this.reloadTimer > 0) return;
    if (this.ammo < 3) {
      game.play('click');
      this.cooldown = 14;
      return;
    }
    this.ammo -= 3;
    this.cooldown = 55;
    this.reloadTimer = 26;
    this.muzzleFlash = 9;
    game.play('rail');
    game.shake = Math.max(game.shake, 11);

    const ox = this.rect.centerx + Math.cos(aimAng) * 20;
    const oy = this.rect.centery + Math.sin(aimAng) * 20;
    const [hx, hy] = raycastWall(game.level, ox, oy, aimAng, 1500);
    game.tracers.push([ox, oy, hx, hy, 12, [120, 220, 255]]);

    const total = pyHypot(hx - ox, hy - oy);
    const steps = trunc(total / 7.0) + 1;
    const hit = new Set();
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      const sx = ox + (hx - ox) * t;
      const sy = oy + (hy - oy) * t;
      for (const e of game.enemies.slice()) {
        if (hit.has(e)) continue;
        if (e.rect.collidepoint(sx, sy)) {
          hit.add(e);
          e.hitAt(game, sx, sy, 95, 6);
        }
      }
    }
    for (let i = 0; i < 8; i++) {
      game.spawnParticle(ox, oy,
                         Math.cos(aimAng) * R.uniform(2, 5) + R.uniform(-1, 1),
                         Math.sin(aimAng) * R.uniform(2, 5) + R.uniform(-1, 1),
                         12, [150, 220, 255], 2);
    }
  }

  // ------------------------------------------------------
  //  PLASMA RIFLE: rapid-fire energy bolts.
  // ------------------------------------------------------
  firePlasma(game, aimAng) {
    if (this.cooldown > 0 || this.reloadTimer > 0) return;
    if (this.ammo < 1) {
      game.play('click');
      this.cooldown = 10;
      return;
    }
    this.ammo -= 1;
    this.cooldown = 8;
    this.muzzleFlash = 3;
    game.play('plasma');

    const ox = this.rect.centerx + Math.cos(aimAng) * 24;
    const oy = this.rect.centery + Math.sin(aimAng) * 24;
    const ang = aimAng + R.uniform(-0.03, 0.03);
    const sp = 13.5;
    game.pshots.push(new PlayerShot(ox, oy, Math.cos(ang) * sp, Math.sin(ang) * sp, {
      kind: 'plasma', dmg: 18, life: 70,
    }));
  }

  // ------------------------------------------------------
  //  MINIGUN: full-auto hitscan, one round per tick of the barrels.
  // ------------------------------------------------------
  fireMinigun(game, aimAng) {
    if (this.cooldown > 0 || this.reloadTimer > 0) return;
    if (this.ammo < 1) {
      game.play('click');
      this.cooldown = 10;
      return;
    }
    this.ammo -= 1;
    this.cooldown = 5;
    this.muzzleFlash = 2;
    game.play('minigun');
    game.shake = Math.max(game.shake, 1.5);

    const ox = this.rect.centerx + Math.cos(aimAng) * 22;
    const oy = this.rect.centery + Math.sin(aimAng) * 22;
    this.firePellets(game, ox, oy, aimAng, 1, 0.07, 720, 8, 3, [255, 240, 160]);
  }

  meleeAttack(game, aimAng) {
    if (this.meleeCd > 0) return;
    const chainsaw = this.clubUpgraded;
    this.meleeCd = chainsaw ? 9 : 20;
    this.meleeAnim = chainsaw ? 12 : 14;
    const dmg = chainsaw ? 26 : 18;
    const reach = chainsaw ? 52 : 44;
    const radius = chainsaw ? 24 : 20;
    game.play(chainsaw ? 'chainsaw' : 'swing');

    const hx = this.rect.centerx + Math.cos(aimAng) * reach;
    const hy = this.rect.centery + Math.sin(aimAng) * reach;
    const hitRect = new Rect(trunc(hx) - radius, trunc(hy) - radius, radius * 2, radius * 2);
    let hitAny = false;
    for (const e of game.enemies.slice()) {
      if (hitRect.colliderect(e.rect)) {
        e.hitAt(game, e.rect.centerx, e.rect.centery, dmg, chainsaw ? 6 : 3);
        hitAny = true;
      }
    }
    if (hitAny) game.shake = Math.max(game.shake, chainsaw ? 6 : 4);
    else game.shake = Math.max(game.shake, 2);
  }

  fireGrapple(game, aimAng) {
    if (!this.hasHook) return;
    const ox = this.rect.centerx, oy = this.rect.centery;
    const [hx, hy] = raycastWall(game.level, ox, oy, aimAng, 640);
    if (pyHypot(hx - ox, hy - oy) >= 639) return;
    const d = pyHypot(hx - ox, hy - oy);
    this.grapple = [hx, hy];
    this.ropeLen = Math.min(d, 180.0);
    game.play('hook');
  }

  update(game) {
    const inp = game.input;
    const level = game.level;

    if (this.cooldown > 0) this.cooldown -= 1;
    if (this.reloadTimer > 0) this.reloadTimer -= 1;
    if (this.meleeCd > 0) this.meleeCd -= 1;
    if (this.meleeAnim > 0) this.meleeAnim -= 1;
    if (this.muzzleFlash > 0) this.muzzleFlash -= 1;
    if (this.hurtFlash > 0) this.hurtFlash -= 1;
    if (this.lavaCd > 0) this.lavaCd -= 1;

    // ---------------- vehicle branch ----------------
    if (this.vehicle !== null) {
      if (this.vehicle.exploded) {
        this.vehicle = null;
      } else {
        const veh = this.vehicle;
        veh.updateDriving(game);
        if (this.vehicle !== null) {            // explode() clears it
          this.rect.setCenter(veh.rect.centerx, veh.rect.centery);
          return;
        }
      }
    }

    // automatic fire for the rapid weapons while the trigger is held
    const wid = this.currentWeaponId();
    if ((wid === 'plasma' || wid === 'minigun') && game.input.mouseHeld.has(1)) {
      const ang = Math.atan2(game.mouseWorld[1] - this.rect.centery,
                             game.mouseWorld[0] - this.rect.centerx);
      this.fireWeapon(game, ang);
    }

    let ax = 0;
    if (inp.down('a') || inp.down('left')) ax -= 1;
    if (inp.down('d') || inp.down('right')) ax += 1;

    if (this.grapple !== null) {
      const [gx, gy] = this.grapple;
      const dx = gx - this.rect.centerx;
      const dy = gy - this.rect.centery;
      let d = pyHypot(dx, dy);
      if (d < 1.0) d = 1.0;
      const nx = dx / d, ny = dy / d;
      if (d > this.ropeLen) {
        const over = d - this.ropeLen;
        let pull = over * 0.30;
        if (pull > 7.0) pull = 7.0;
        this.vx += nx * pull;
        this.vy += ny * pull;
      }
      if (inp.down('w') || inp.down('up')) this.ropeLen = Math.max(48.0, this.ropeLen - 6.0);
      else if (inp.down('s') || inp.down('down')) this.ropeLen = Math.min(520.0, this.ropeLen + 4.0);
      this.vx *= 0.994;
      this.vy *= 0.994;
    }

    const target = ax * MOVE_SPEED;
    if (this.grapple !== null) this.vx += (target - this.vx) * 0.07;
    else if (this.onGround) this.vx += (target - this.vx) * 0.36;
    else this.vx += (target - this.vx) * 0.11;

    this.vy += GRAVITY;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;

    const shift = inp.down('lshift') || inp.down('rshift');
    if (shift && this.hasJet && this.fuel > 0.5) {
      this.vy -= 1.18;
      if (this.vy < -8.6) this.vy = -8.6;
      this.fuel -= 0.55;
      if (this.fuel < 0) this.fuel = 0.0;
      for (let i = 0; i < 2; i++) {
        game.spawnParticle(
          this.rect.centerx + R.uniform(-6, 6),
          this.rect.bottom - 4,
          R.uniform(-1.2, 1.2),
          R.uniform(1.5, 3.6),
          18, R.choice([[255, 170, 60], [255, 90, 30], [200, 200, 200]]),
          R.randint(2, 4));
      }
      this.jetSfx -= 1;
      if (this.jetSfx <= 0) {
        game.play('jet');
        this.jetSfx = 12;
      }
    }

    if (inp.down('space') && this.onGround) {
      this.vy = JUMP_VEL;
      this.onGround = false;
      game.play('jump');
      for (let i = 0; i < 4; i++) {
        game.spawnParticle(this.rect.centerx + R.uniform(-8, 8), this.rect.bottom,
                           R.uniform(-1.5, 1.5), R.uniform(-0.4, 0.6), 14, [140, 120, 100], 2);
      }
    }

    if (this.vx > MAX_SPEED) this.vx = MAX_SPEED;
    if (this.vx < -MAX_SPEED) this.vx = -MAX_SPEED;
    if (this.vy > MAX_SPEED) this.vy = MAX_SPEED;
    if (this.vy < -MAX_SPEED) this.vy = -MAX_SPEED;

    [this.vx, this.vy, this.onGround] = moveAndCollide(this.rect, this.vx, this.vy, level);

    if (Math.abs(this.vx) > 0.6 && this.onGround) this.walkAnim += Math.abs(this.vx) * 0.08;
    if (this.vx > 0.3) this.facing = 1;
    else if (this.vx < -0.3) this.facing = -1;

    if (this.onGround) this.fuel = Math.min(this.maxFuel, this.fuel + 0.34);

    if (level.lavaOverlapping(this.rect)) {
      if (this.lavaCd <= 0) {
        this.damage(14, game);
        this.lavaCd = 22;
        this.vy = -7.0;
      }
      for (let i = 0; i < 2; i++) {
        game.spawnParticle(this.rect.centerx + R.uniform(-10, 10), this.rect.bottom - 6,
                           R.uniform(-1.5, 1.5), R.uniform(-3.5, -1.0),
                           22, R.choice([[255, 160, 40], [220, 70, 10]]), 3);
      }
    }

    if (this.rect.top > level.pixelH + 200) this.damage(100, game);
  }

  draw(g, cx, cy, mouseWorld) {
    const r = this.rect.copy();
    r.x -= cx;
    r.y -= cy;
    const body = this.hurtFlash === 0 ? C_MARINE : [230, 120, 120];
    const dark = this.hurtFlash === 0 ? C_MARINE_D : [170, 80, 80];
    const ang = Math.atan2(mouseWorld[1] - this.rect.centery, mouseWorld[0] - this.rect.centerx);

    const swing = this.onGround ? Math.sin(this.walkAnim) * 5 : 3;
    g.rect(dark, r.x + 1, r.y + 20, 8, 14 + trunc(swing));
    g.rect(dark, r.x + 13, r.y + 20, 8, 14 - trunc(swing));
    g.rect(body, r.x + 1, r.y + 10, 20, 16);
    g.rect(dark, r.x + 1, r.y + 10, 20, 4);
    g.rect(body, r.x + 3, r.y, 16, 12);
    g.rect([18, 24, 18], r.x + 4, r.y + 4, 14, 5);
    g.rect([120, 200, 140], r.x + 6 + (this.facing > 0 ? 2 : 0), r.y + 5, 6, 3);
    g.rect(dark, this.facing > 0 ? r.x - 3 : r.x + 19, r.y + 12, 5, 12);

    const wid = this.currentWeaponId();
    let drawAng = ang;
    if (this.reloadTimer > 0) {
      const prog = 1.0 - (this.reloadTimer / this.reloadMax);
      const tilt = Math.sin(prog * Math.PI) * 0.95;
      drawAng = ang + tilt;
    }
    if (wid === 'club') this.drawMelee(g, r, ang, drawAng);
    else this.drawGun(g, r, drawAng, wid);
  }

  drawMelee(g, r, aimAng, drawAng) {
    const sx = r.centerx, sy = r.y + 18;
    let swing = 0.0;
    if (this.meleeAnim > 0) swing = Math.sin((this.meleeAnim / 14.0) * Math.PI) * 0.9;
    const eff = drawAng + swing;
    const reach = this.clubUpgraded ? 30 : 26;
    const ex = sx + Math.cos(eff) * reach;
    const ey = sy + Math.sin(eff) * reach;
    if (this.clubUpgraded) {
      g.line([56, 56, 60], sx, sy, ex, ey, 7);
      g.line([110, 110, 120], sx, sy, ex, ey, 4);
      for (let i = 0; i < 3; i++) {
        const t = 0.45 + i * 0.22;
        const tx = sx + Math.cos(eff) * reach * t;
        const ty = sy + Math.sin(eff) * reach * t;
        const px = -Math.sin(eff) * 5;
        const py = Math.cos(eff) * 5;
        g.line([200, 200, 210], tx + px, ty + py, tx - px, ty - py, 2);
      }
      g.circle([255, 180, 40], trunc(ex), trunc(ey), 5);
      g.circle([255, 240, 120], trunc(ex), trunc(ey), 2);
    } else {
      g.line([70, 50, 28], sx, sy, ex, ey, 6);
      g.circle([120, 120, 130], trunc(ex), trunc(ey), 6);
      g.circle([170, 170, 180], trunc(ex), trunc(ey), 3);
    }
  }

  drawGun(g, r, drawAng, wid) {
    const sx = r.centerx, sy = r.y + 18;

    if (wid === 'railgun') {
      const ex = sx + Math.cos(drawAng) * 42;
      const ey = sy + Math.sin(drawAng) * 42;
      g.line([70, 90, 110], sx, sy, ex, ey, 7);
      g.line([140, 210, 255], sx, sy, ex, ey, 3);
      for (let i = 1; i <= 3; i++) {
        const t = 0.35 + i * 0.18;
        g.circle([120, 220, 255], trunc(sx + Math.cos(drawAng) * 42 * t),
                 trunc(sy + Math.sin(drawAng) * 42 * t), 3);
      }
      g.circle([200, 245, 255], trunc(ex), trunc(ey), 3);
    } else if (wid === 'grenade') {
      const ex = sx + Math.cos(drawAng) * 26;
      const ey = sy + Math.sin(drawAng) * 26;
      g.line([80, 110, 70], sx, sy, ex, ey, 10);
      g.circle([50, 70, 45], trunc(sx + Math.cos(drawAng) * 10),
               trunc(sy + Math.sin(drawAng) * 10), 8);
      g.circle([140, 180, 90], trunc(ex), trunc(ey), 5);
    } else if (wid === 'plasma') {
      const ex = sx + Math.cos(drawAng) * 30;
      const ey = sy + Math.sin(drawAng) * 30;
      g.line([70, 90, 130], sx, sy, ex, ey, 8);
      g.circle([90, 150, 255], trunc(ex), trunc(ey), 5);
      g.circle([200, 235, 255], trunc(ex), trunc(ey), 3);
    } else if (wid === 'minigun') {
      const ex = sx + Math.cos(drawAng) * 30;
      const ey = sy + Math.sin(drawAng) * 30;
      const perp = drawAng + Math.PI / 2;
      for (const off of [-4, 0, 4]) {
        const ox = Math.cos(perp) * off, oy = Math.sin(perp) * off;
        g.line([90, 90, 100], sx + ox, sy + oy, ex + ox, ey + oy, 3);
      }
      g.circle([110, 110, 120], trunc(ex), trunc(ey), 7);
    } else {
      const length = wid === 'shotgun' ? 30 : 38;
      const thick = wid === 'shotgun' ? 8 : 10;
      const ex = sx + Math.cos(drawAng) * length;
      const ey = sy + Math.sin(drawAng) * length;
      g.line(C_GUN, sx, sy, ex, ey, thick);
      const mx = sx + Math.cos(drawAng) * (length * 0.6);
      const my = sy + Math.sin(drawAng) * (length * 0.6);
      g.circle([130, 130, 140], trunc(mx), trunc(my), 4);
      g.circle([130, 130, 140], trunc(ex), trunc(ey), wid === 'shotgun' ? 5 : 6);
      g.circle([60, 60, 66], trunc(ex), trunc(ey), 2);
      if (wid === 'supershotgun') {
        const perp = drawAng + Math.PI / 2;
        const bx = Math.cos(perp) * 4, by = Math.sin(perp) * 4;
        g.line([80, 80, 88], sx + bx, sy + by, ex + bx, ey + by, 5);
        g.circle([130, 130, 140], trunc(ex + bx), trunc(ey + by), 5);
      }
    }

    if (this.muzzleFlash > 0) {
      const mf = this.muzzleFlash / 9.0;
      const reach = wid === 'railgun' ? 42 : (wid === 'supershotgun' ? 38 : 30);
      const mx = sx + Math.cos(drawAng) * reach;
      const my = sy + Math.sin(drawAng) * reach;
      const rad = wid === 'supershotgun' ? trunc(14 * mf) + 4 : trunc(10 * mf) + 3;
      g.circle([255, 240, 160], trunc(mx), trunc(my), rad);
      g.circle([255, 170, 40], trunc(mx), trunc(my), Math.max(2, rad - 4));
    }
  }

  drawGrapple(g, cx, cy) {
    if (this.grapple === null) return;
    const gx = trunc(this.grapple[0]) - cx;
    const gy = trunc(this.grapple[1]) - cy;
    const px = this.rect.centerx - cx;
    const py = this.rect.centery - cy;
    g.line([150, 150, 140], px, py, gx, gy, 3);
    g.circle([200, 200, 190], gx, gy, 6);
    g.circle([90, 90, 90], gx, gy, 3);
  }
}

// ============================================================
//  ROVER  (drivable Mars truck)
// ============================================================
class Rover {
  constructor(x, y) {
    this.rect = new Rect(x, y, 56, 32);
    this.vx = 0.0;
    this.vy = 0.0;
    this.onGround = false;
    this.hp = ROVER_MAX_HP;
    this.maxhp = ROVER_MAX_HP;
    this.facing = 1;
    this.wheelRot = 0.0;
    this.exploded = false;
    this.playerInside = false;
    this.hurtFlash = 0;
    this.lavaCd = 0;
  }

  damage(amount, game) {
    if (this.exploded) return;
    this.hp -= amount;
    this.hurtFlash = 6;
    game.play('hurt');
    game.shake = Math.max(game.shake, 5);
    if (this.hp <= 0) this.explode(game);
  }

  explode(game) {
    if (this.exploded) return;
    this.exploded = true;
    this.hp = 0;
    game.spawnBurst(this.rect.centerx, this.rect.centery, [255, 160, 40], 40);
    game.spawnBurst(this.rect.centerx, this.rect.centery, [90, 90, 90], 20);
    game.play('boom');
    game.shake = Math.max(game.shake, 20);
    if (this.playerInside && game.player !== null) {
      const p = game.player;
      this.playerInside = false;
      p.vehicle = null;
      const test = new Rect(this.rect.centerx - (p.rect.w >> 1), this.rect.top - p.rect.h - 1, p.rect.w, p.rect.h);
      for (let i = 0; i < 12; i++) {
        if (!game.level.tilesOverlapping(test).some(t => test.colliderect(t))) break;
        test.y -= 6;
      }
      p.rect.x = test.x;
      p.rect.y = test.y;
      p.vx = 0.0;
      p.vy = -8.0;
      p.onGround = false;
      p.damage(30, game);
    }
  }

  // Physics for a rover nobody is driving (falls if spawned mid-air).
  updateIdle(game) {
    if (this.exploded) return;
    if (this.lavaCd > 0) this.lavaCd -= 1;
    this.vy += ROVER_GRAVITY;
    if (this.vy > ROVER_MAX_FALL) this.vy = ROVER_MAX_FALL;
    this.vx *= 0.90;
    [this.vx, this.vy, this.onGround] = moveAndCollide(this.rect, this.vx, this.vy, game.level);
    if (game.level.lavaOverlapping(this.rect) && this.lavaCd <= 0) {
      this.damage(20, game);
      this.lavaCd = 20;
    }
    if (this.rect.top > game.level.pixelH + 200) this.explode(game);
  }

  updateDriving(game) {
    if (this.exploded) return;
    const inp = game.input;
    const level = game.level;

    if (this.hurtFlash > 0) this.hurtFlash -= 1;
    if (this.lavaCd > 0) this.lavaCd -= 1;

    let ax = 0;
    if (inp.down('a') || inp.down('left')) ax -= 1;
    if (inp.down('d') || inp.down('right')) ax += 1;

    const target = ax * ROVER_SPEED;
    if (this.onGround) this.vx += (target - this.vx) * 0.22;
    else this.vx += (target - this.vx) * 0.08;       // less air control

    this.vy += ROVER_GRAVITY;
    if (this.vy > ROVER_MAX_FALL) this.vy = ROVER_MAX_FALL;
