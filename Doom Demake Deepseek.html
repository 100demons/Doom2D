    if (inp.down('space') && this.onGround) {
      this.vy = ROVER_JUMP_VEL;
      this.onGround = false;
      game.play('jump');
      for (let i = 0; i < 6; i++) {
        game.spawnParticle(this.rect.centerx + R.uniform(-12, 12), this.rect.bottom,
                           R.uniform(-2, 2), R.uniform(-0.5, 0.8), 16, [140, 120, 100], 3);
      }
    }

    [this.vx, this.vy, this.onGround] = moveAndCollide(this.rect, this.vx, this.vy, level);

    if (this.vx > 0.3) this.facing = 1;
    else if (this.vx < -0.3) this.facing = -1;
    this.wheelRot += this.vx * 0.08;

    if (level.lavaOverlapping(this.rect)) {
      if (this.lavaCd <= 0) {
        this.damage(20, game);
        this.lavaCd = 20;
        this.vy = -6.0;
      }
      for (let i = 0; i < 2; i++) {
        game.spawnParticle(this.rect.centerx + R.uniform(-14, 14), this.rect.bottom - 6,
                           R.uniform(-1.5, 1.5), R.uniform(-3.5, -1.0),
                           22, R.choice([[255, 160, 40], [220, 70, 10]]), 3);
      }
    }

    if (this.rect.top > level.pixelH + 200) this.explode(game);
  }

  draw(g, cx, cy) {
    const r = this.rect.copy();
    r.x -= cx;
    r.y -= cy;

    if (this.exploded) {
      g.roundRect([30, 25, 22], r.x + 4, r.y + 12, r.w - 8, r.h - 18, 4);
      g.roundRect([18, 14, 12], r.x + 10, r.y + 16, r.w - 20, r.h - 24, 3);
      return;
    }

    const flip = this.facing < 0;
    const wheelY = r.bottom - 7;

    // wheels
    for (const wx of [r.x + 2, r.x + r.w - 20]) {
      g.circle([25, 25, 25], wx + 9, wheelY, 9);
      g.circle([70, 70, 70], wx + 9, wheelY, 6);
      g.circle([140, 140, 140], wx + 9, wheelY, 2);
      const ex = wx + 9 + Math.cos(this.wheelRot) * 5;
      const ey = wheelY + Math.sin(this.wheelRot) * 5;
      g.line([200, 200, 200], wx + 9, wheelY, ex, ey, 2);
    }

    const bodyCol = this.hurtFlash === 0 ? [200, 80, 60] : [255, 220, 220];
    const dark = [90, 40, 30];
    const metal = [155, 165, 180];
    const glass = [120, 190, 230];

    // chassis / undercarriage
    g.roundRect(dark, r.x + 2, r.y + 15, r.w - 4, 10, 3);

    // cargo bed (rear of the truck)
    const bedW = 24;
    const bedX = flip ? r.x + r.w - bedW - 2 : r.x + 2;
    g.rect(metal, bedX, r.y + 8, bedW, 9);
    g.rect([60, 70, 80], bedX + 1, r.y + 9, bedW - 2, 7);
    g.line(dark, bedX, r.y + 8, bedX + bedW, r.y + 8, 2);

    // cab (front of the truck)
    const cabW = 24;
    const cabX = flip ? r.x + 2 : r.x + r.w - cabW - 2;
    g.roundRect(bodyCol, cabX, r.y + 3, cabW, 16, 3);
    // windshield
    const wsX = flip ? cabX + 4 : cabX + cabW - 11;
    g.roundRect(glass, wsX, r.y + 6, 7, 7, 2);
    // roof marker light
    g.circle([255, 200, 80], cabX + (cabW >> 1), r.y + 2, 2);
    // headlight (front face)
    const hlX = flip ? r.x + 3 : r.x + r.w - 3;
    g.circle([255, 240, 160], hlX, r.y + 14, 3);
    // exhaust stack behind the cab
    const exX = flip ? cabX + cabW - 3 : cabX + 1;
    g.rect([70, 70, 80], exX, r.y - 1, 3, 8);

    if (this.playerInside) {
      g.circle(C_SKIN, wsX + 4, r.y + 11, 3);
    }

    if (this.hp < this.maxhp) {
      const barw = 52;
      const bx = r.centerx - (barw >> 1);
      const by = r.y - 14;
      g.rect([30, 0, 0], bx, by, barw, 5);
      const frac = Math.max(0.0, this.hp / this.maxhp);
      g.rect([80, 160, 220], bx, by, trunc(barw * frac), 5);
    }
  }
}

// ============================================================
//  GAME
// ============================================================
const SOLID_EDGE = rgb([56, 40, 30]);
const SOLID_BASES = [rgb(C_DIRT), rgb(C_DIRT_D), rgb([88, 64, 46])];
const TILE_TOP = rgb(C_DIRT_L);
const TILE_BOTTOM = rgb([36, 24, 18]);
const TILE_LINE = rgb([40, 28, 20]);
const TILE_SPECK = rgb([58, 42, 32]);
const LAVA_BASE = rgb([120, 24, 4]);
const LAVA_BODY = rgb(C_LAVA);
const LAVA_HI = rgb(C_LAVA_H);
const TILE_LAYERS = [
  [SOLID_EDGE, SOLID_BASES[0], SOLID_BASES[1], SOLID_BASES[2], LAVA_BASE],
  [TILE_TOP, TILE_BOTTOM, LAVA_BODY],
  [LAVA_HI, TILE_LINE, TILE_SPECK],
];

// weapons that unlock as the campaign descends: [level index, weapon id]
const WEAPON_UNLOCKS = [
  [3, 'grenade'],
  [6, 'minigun'],
  [9, 'supershotgun'],
  [13, 'railgun'],
  [17, 'plasma'],
];

function freshPersist() {
  return {
    health: 100, ammo: 30,
    hasJet: false, hasHook: false,
    weapons: ['shotgun', 'club'],
    currentWeapon: 0,
    kills: 0,
    clubUpgraded: false,
  };
}

function nowMs() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
}

class Game {
  constructor({ gfx, input, audio }) {
    this.gfx = gfx;
    this.input = input;
    this.audio = audio;
    this.state = 'start';
    this.levelIndex = 0;
    this.persist = freshPersist();
    this.levelSeeds = [];
    for (let i = 0; i < TOTAL_LEVELS; i++) this.levelSeeds.push(R.randint(1, 2 ** 30));
    this.tick = 0;
    this.msg = '';
    this.msgTimer = 0;
    this.shake = 0;
    this.transition = 0;
    this.deathTimer = 0;
    this.level = null;
    this.player = null;
    this.enemies = [];
    this.ebullets = [];
    this.pshots = [];
    this.tracers = [];
    this.particles = [];
    this.items = [];
    this.rovers = [];
    this.camX = 0.0;
    this.camY = 0.0;
    this.mouseWorld = [0, 0];
    this.cheatAt = null;          // timestamp of the last "2" keypress

    // ---- procedural background tile ----
    this.bgSize = 256;
    gfx.setBackground(makeBgTexturePixels(this.bgSize), this.bgSize);
  }

  // --------------------------------------------------
  play(name) { if (this.audio) this.audio.play(name); }

  spawnParticle(x, y, vx, vy, life, color, size) {
    this.particles.push([x, y, vx, vy, life, color, size]);
  }

  spawnBurst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = R.uniform(0, Math.PI * 2);
      const sp = R.uniform(1.0, 4.0);
      this.spawnParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, R.randint(10, 26), color, R.randint(2, 4));
    }
  }

  // Radial explosion: damages every enemy whose rect touches the blast,
  // with linear falloff. Used by the grenade launcher.
  explode(x, y, radius, dmg) {
    this.spawnBurst(x, y, [255, 180, 60], 22);
    this.spawnBurst(x, y, [120, 60, 20], 12);
    this.play('boom');
    this.shake = Math.max(this.shake, 12);
    for (let i = 0; i < 14; i++) {
      const a = R.uniform(0, TAU);
      this.spawnParticle(x + Math.cos(a) * radius * 0.35, y + Math.sin(a) * radius * 0.35,
                         Math.cos(a) * R.uniform(1.5, 4.5), Math.sin(a) * R.uniform(1.5, 4.5),
                         R.randint(14, 28), [255, 200, 90], R.randint(2, 4));
    }
    for (const e of this.enemies.slice()) {
      if (e.dead) continue;
      const nx = Math.max(e.rect.x, Math.min(x, e.rect.x + e.rect.w));
      const ny = Math.max(e.rect.y, Math.min(y, e.rect.y + e.rect.h));
      const d = pyHypot(nx - x, ny - y);
      if (d <= radius) {
        const fall = 1 - d / radius;
        e.hitAt(this, nx, ny, Math.max(4, trunc(dmg * fall)), 4);
      }
    }
  }

  killEnemy(e) {
    const i = this.enemies.indexOf(e);
    if (i >= 0) this.enemies.splice(i, 1);
    e.dead = true;
    this.spawnBurst(e.rect.centerx, e.rect.centery, C_BLOOD, 18);
    this.spawnBurst(e.rect.centerx, e.rect.centery, [90, 20, 20], 10);
    this.play('boom');
    if (this.player !== null && !this.player.dead) this.player.registerKill(this);
    if (e.kind === 'H') {
      this.msg = 'ARM  SEVERED  -  THE  HEAD  REMAINS';
      this.msgTimer = 110;
    }
    // the Overseer's arms die with it
    if (e.kind === 'B') {
      const hands = this.enemies.filter(x => x.kind === 'H');
      for (const h of hands) {
        const j = this.enemies.indexOf(h);
        if (j >= 0) this.enemies.splice(j, 1);
        h.dead = true;
        this.spawnBurst(h.rect.centerx, h.rect.centery, [255, 140, 60], 14);
      }
      this.msg = 'THE  OVERSEER  IS  DEAD  -  THE  EXIT  IS  OPEN';
      this.msgTimer = 220;
    }
  }

  // --------------------------------------------------
  loadLevel(idx) {
    const rng = new PyRandom(this.levelSeeds[idx]);
    if (idx === TOTAL_LEVELS - 1) this.level = generateBossArena(rng);
    else this.level = generateLevelData(idx, rng);
    this.player = new Player(this.level.spawn[0], this.level.spawn[1]);
    const P = this.persist, p = this.player;
    p.health = P.health;
    p.ammo = P.ammo;
    p.hasJet = P.hasJet;
    p.hasHook = P.hasHook;
    p.weapons = (P.weapons || ['shotgun', 'club']).slice();
    p.currentWeapon = P.currentWeapon || 0;
    p.kills = P.kills || 0;
    p.clubUpgraded = P.clubUpgraded || false;

    this.enemies = this.level.entitySpawns.map(([k, x, y]) => new Enemy(k, x, y));
    this.items = this.level.itemSpawns.map(([k, x, y]) => new Item(k, x, y));
    this.rovers = this.level.roverSpawns.map(([x, y]) => new Rover(x, y));
    this.ebullets = [];
    this.pshots = [];
    this.tracers = [];
    this.particles = [];
    this.camX = Math.max(0.0, p.rect.centerx - (SCREEN_W >> 1));
    this.camY = Math.max(0.0, p.rect.centery - (SCREEN_H >> 1));
    this.msg = 'LEVEL ' + (idx + 1) + '/' + TOTAL_LEVELS + '  -  ' + LEVEL_NAMES[idx];
    this.msgTimer = 160;

    for (const [lvl, wid] of WEAPON_UNLOCKS) {
      if (idx >= lvl && !p.weapons.includes(wid)) {
        p.weapons.push(wid);
        this.msg = WEAPON_NAMES[wid] + '  UNLOCKED  -  PRESS  P  TO  SWITCH';
        this.msgTimer = 220;
      }
    }
    if (idx === TOTAL_LEVELS - 1) {
      this.msg = 'THE  OVERSEER  -  DESTROY  THE  HEAD,  THE  ARMS  ARE  OPTIONAL';
      this.msgTimer = 260;
    }
  }

  savePersist() {
    const P = this.persist, p = this.player;
    P.health = p.health;
    P.ammo = p.ammo;
    P.hasJet = p.hasJet;
    P.hasHook = p.hasHook;
    P.weapons = p.weapons.slice();
    P.currentWeapon = p.currentWeapon;
    P.kills = p.kills;
    P.clubUpgraded = p.clubUpgraded;
  }

  restartLevel() {
    this.persist.health = 100;
    this.persist.ammo = Math.max(30, this.persist.ammo);
    this.loadLevel(this.levelIndex);
    this.state = 'play';
  }

  newGame() {
    this.state = 'play';
    this.levelIndex = 0;
    this.persist = freshPersist();
    this.loadLevel(0);
  }

  // ---- cheat: type "27" quickly to warp straight to the Overseer ----
  warpToBoss() {
    const P = this.persist;
    P.health = 100;
    P.ammo = Math.max(P.ammo, 120);
    P.hasJet = true;
    P.hasHook = true;
    P.weapons = ['shotgun', 'club', 'grenade', 'minigun', 'supershotgun', 'railgun', 'plasma'];
    P.currentWeapon = 0;
    this.levelIndex = TOTAL_LEVELS - 1;
    this.loadLevel(this.levelIndex);
    this.state = 'play';
    this.msg = 'CHEAT  ENGAGED  -  WARP  TO  THE  OVERSEER';
    this.msgTimer = 240;
  }

  // --------------------------------------------------
  //  ev: {type:'keydown', key} | {type:'mousedown'|'mouseup', button}
  //  (button 1 = left, 3 = right, as in pygame)
  handleEvent(ev) {
    if (ev.type === 'keydown') {
      // cheat code: "2" then "7" within one second
      if (ev.key === '2') {
        this.cheatAt = nowMs();
      } else if (ev.key === '7' && this.cheatAt !== null && nowMs() - this.cheatAt < 1000) {
        this.cheatAt = null;
        this.warpToBoss();
        return;
      }

      if (ev.key === 'escape') {          // desktop build quit; here: back to the title screen
        this.state = 'start';
        return;
      }
      const go = ev.key === 'return' || ev.key === 'space';
      if (this.state === 'start') {
        if (go) this.newGame();
      } else if (this.state === 'win') {
        if (go) this.state = 'start';
      } else if (this.state === 'dead') {
        if (go) this.restartLevel();
      } else if (this.state === 'play') {
        if (ev.key === 'r') this.restartLevel();
        else if (ev.key === 'p') { if (this.player && !this.player.dead) this.player.switchWeapon(this); }
        else if (ev.key === 'e') { if (this.player && !this.player.dead) this.player.toggleVehicle(this); }
      }
    }

    if (this.state !== 'play') return;

    if (ev.type === 'mousedown') {
      const p = this.player;
      if (ev.button === 1) {
        if (!p.dead) {
          const ang = Math.atan2(this.mouseWorld[1] - p.rect.centery, this.mouseWorld[0] - p.rect.centerx);
          p.fireWeapon(this, ang);
        }
      } else if (ev.button === 3) {
        if (!p.dead && p.hasHook && p.grapple === null && p.vehicle === null) {
          const ang = Math.atan2(this.mouseWorld[1] - p.rect.centery, this.mouseWorld[0] - p.rect.centerx);
          p.fireGrapple(this, ang);
        }
      }
    } else if (ev.type === 'mouseup') {
      if (ev.button === 3 && this.player !== null) this.player.grapple = null;
    }
  }

  // --------------------------------------------------
  update() {
    this.tick += 1;
    if (this.shake > 0) this.shake -= 1;
    if (this.msgTimer > 0) this.msgTimer -= 1;
    if (this.state === 'play') this.updatePlay();
    else if (this.state === 'dead') {
      this.deathTimer -= 1;
      this.updateParticles();
    }
  }

  updateParticles() {
    const alive = [];
    for (const p of this.particles) {
      p[0] += p[2];
      p[1] += p[3];
      p[3] += 0.16;
      p[2] *= 0.99;
      p[4] -= 1;
      if (p[4] > 0) alive.push(p);
    }
    this.particles = alive;
  }

  updatePlay() {
    const p = this.player;
    const level = this.level;

    const [mx, my] = this.input.mouse;
    this.mouseWorld = [mx + this.camX, my + this.camY];

    if (!p.dead) {
      p.update(this);
    } else {
      this.deathTimer = 60;
      this.state = 'dead';
      this.savePersist();
      return;
    }

    // idle rovers (not being driven) still simulate physics
    for (const r of this.rovers) {
      if (!r.exploded && !r.playerInside) r.updateIdle(this);
    }

    for (const e of this.enemies.slice()) e.update(this);

    for (const b of this.ebullets.slice()) {
      b.update(this);
      if (b.dead) {
        const i = this.ebullets.indexOf(b);
        if (i >= 0) this.ebullets.splice(i, 1);
      }
    }

    for (const s of this.pshots.slice()) {
      s.update(this);
      if (s.dead) {
        const i = this.pshots.indexOf(s);
        if (i >= 0) this.pshots.splice(i, 1);
      }
    }

    for (const it of this.items.slice()) {
      it.update();
      if (p.hitbox().colliderect(it.rect) || p.rect.colliderect(it.rect)) {
        if (it.kind === 'J') {
          p.hasJet = true;
          this.msg = 'JETPACK ACQUIRED  -  HOLD SHIFT TO FLY';
          this.msgTimer = 170;
        } else if (it.kind === 'G') {
          p.hasHook = true;
          this.msg = 'GRAPPLE ACQUIRED  -  RIGHT-CLICK TO FIRE';
          this.msgTimer = 170;
        } else if (it.kind === 'H') {
          p.health = Math.min(100, p.health + 25);
          this.msg = 'MEDIKIT +25';
          this.msgTimer = 90;
        } else if (it.kind === 'A') {
          p.ammo += 10;
          this.msg = 'AMMO +10';
          this.msgTimer = 90;
        }
        const i = this.items.indexOf(it);
        if (i >= 0) this.items.splice(i, 1);
        this.play('pickup');
        this.spawnBurst(it.rect.centerx, it.rect.centery, [255, 230, 120], 12);
      }
    }

    for (const t of this.tracers.slice()) {
      t[4] -= 1;
      if (t[4] <= 0) {
        const i = this.tracers.indexOf(t);
        if (i >= 0) this.tracers.splice(i, 1);
      }
    }

    this.updateParticles();

    let tx = p.rect.centerx - (SCREEN_W >> 1);
    let ty = p.rect.centery - (SCREEN_H >> 1);
    const maxX = Math.max(0, level.pixelW - SCREEN_W);
    const maxY = Math.max(0, level.pixelH - SCREEN_H);
    tx = Math.max(0, Math.min(maxX, tx));
    ty = Math.max(0, Math.min(maxY, ty));
    this.camX += (tx - this.camX) * 0.18;
    this.camY += (ty - this.camY) * 0.18;
    if (Math.abs(this.camX - tx) < 1) this.camX = tx;
    if (Math.abs(this.camY - ty) < 1) this.camY = ty;

    // exit (the Overseer blocks the exit on level 27)
    if (level.exitRect !== null && p.hitbox().colliderect(level.exitRect)) {
      const bossAlive = this.enemies.some(e => e.kind === 'B');
      if (this.levelIndex === TOTAL_LEVELS - 1 && bossAlive) {
        this.msg = 'THE OVERSEER  STILL  LIVES !';
        this.msgTimer = 80;
      } else {
        this.savePersist();
        this.levelIndex += 1;
        if (this.levelIndex >= TOTAL_LEVELS) {
          this.state = 'win';
          this.msgTimer = 0;
        } else {
          this.loadLevel(this.levelIndex);
        }
      }
    }
  }

  // --------------------------------------------------
  drawWorld() {
    const g = this.gfx;
    const level = this.level;
    let shakeX = 0, shakeY = 0;
    if (this.shake > 0) {
      shakeX = R.randint(-this.shake, this.shake);
      shakeY = R.randint(-this.shake, this.shake);
    }
    const ox = trunc(this.camX) - shakeX;
    const oy = trunc(this.camY) - shakeY;

    // ---- tiled procedural background (parallax) ----
    const bs = this.bgSize;
    const offX = pyMod(trunc(-this.camX * 0.30), bs);
    const offY = pyMod(trunc(-this.camY * 0.30), bs);
    const nx = Math.floor(SCREEN_W / bs) + 2;
    const ny = Math.floor(SCREEN_H / bs) + 2;
    for (let ty = -1; ty < ny; ty++) {
      for (let tx = -1; tx < nx; tx++) g.blitBg(offX + tx * bs, offY + ty * bs);
    }

    // ---- tiles (batched by colour, same layering as the original) ----
    const x0 = Math.max(0, Math.floor(ox / TILE) - 1);
    const x1 = Math.min(level.w - 1, Math.floor((ox + SCREEN_W) / TILE) + 1);
    const y0 = Math.max(0, Math.floor(oy / TILE) - 1);
    const y1 = Math.min(level.h - 1, Math.floor((oy + SCREEN_H) / TILE) + 1);
    const drawn = (tx, ty) => tx >= x0 && tx <= x1 && ty >= y0 && ty <= y1 &&
                              (level.lava[ty][tx] || level.solid[ty][tx]);

    for (let ty = y0; ty <= y1; ty++) {
      const lrow = level.lava[ty], srow = level.solid[ty];
      for (let tx = x0; tx <= x1; tx++) {
        if (lrow[tx]) {
          const px = tx * TILE - ox, py = ty * TILE - oy;
          g.batchRect(LAVA_BASE, px, py, TILE, TILE);
          const wave = Math.sin(this.tick * 0.09 + tx * 0.7 + ty * 1.3);
          const h = 6 + trunc(wave * 3);
          g.batchRect(LAVA_BODY, px, py + 4, TILE, TILE - 4);
          g.batchRect(LAVA_HI, px, py + 4, TILE, h);
          if (R.random() < 0.02) {
            this.spawnParticle(tx * TILE + 16, ty * TILE + 8,
                               R.uniform(-0.5, 0.5), R.uniform(-2.5, -0.8),
                               40, [255, 170, 60], 3);
          }
        } else if (srow[tx]) {
          const px = tx * TILE - ox, py = ty * TILE - oy;
          let base;
          if (ty === 0 || ty === level.h - 1 || tx === 0 || tx === level.w - 1) base = SOLID_EDGE;
          else base = SOLID_BASES[(tx * 7 + ty * 13) % 3];
          g.batchRect(base, px, py, TILE, TILE);
          g.batchRect(TILE_TOP, px, py, TILE, 4);
          g.batchRect(TILE_BOTTOM, px, py + TILE - 4, TILE, 4);
          g.batchRect(TILE_LINE, px + TILE - 1, py, 1, TILE);
          if (!drawn(tx + 1, ty)) g.batchRect(TILE_LINE, px + TILE, py, 1, TILE);
          if (!drawn(tx, ty + 1)) g.batchRect(TILE_LINE, px + TILE - 1, py + TILE, 1, 1);
          if (!drawn(tx + 1, ty + 1)) g.batchRect(TILE_LINE, px + TILE, py + TILE, 1, 1);
          if ((tx * 31 + ty * 17) % 5 === 0) g.batchRect(TILE_SPECK, px + 7, py + 11, 6, 5);
          if ((tx * 13 + ty * 29) % 7 === 0) g.batchRect(TILE_SPECK, px + 19, py + 20, 5, 4);
        }
      }
    }
    for (const layer of TILE_LAYERS) for (const css of layer) g.flushBatch(css);

    if (level.exitRect !== null) {
      const r = level.exitRect;
      const px = r.x - ox, py = r.y - oy;
      const glow = 120 + trunc(Math.sin(this.tick * 0.12) * 60);
      g.rect([20, 40, 20], px, py, TILE, TILE);
      g.rectOutline([30, glow, 40], px + 3, py + 3, TILE - 6, TILE - 6, 3);
      g.rect([10, 90, 20], px + 6, py + 6, TILE - 12, TILE - 12);
      g.circle([60, 255, 90], px + 16, py + 16, 5);
    }

    for (const it of this.items) it.draw(g, ox, oy);
    for (const r of this.rovers) {
      r.draw(g, ox, oy);
      if (!r.exploded && this.player.vehicle === null && !this.player.dead) {
        const d = pyHypot(this.player.rect.centerx - r.rect.centerx,
                             this.player.rect.centery - r.rect.centery);
        if (d < 90) {
          const label = '[E]  ENTER';
          const px = r.rect.centerx - ox - (g.textWidth('m', label) >> 1);
          const py = r.rect.top - oy - 26;
          g.text('m', label, [255, 240, 120], px, py);
        }
      }
    }
    for (const b of this.ebullets) b.draw(g, ox, oy);
    for (const e of this.enemies) e.draw(g, ox, oy);
    for (const s of this.pshots) s.draw(g, ox, oy);

    if (this.player.vehicle === null) {
      this.player.drawGrapple(g, ox, oy);
      if (!this.player.dead) this.player.draw(g, ox, oy, this.mouseWorld);
    }

    for (const t of this.tracers) {
      const alpha = Math.max(0, t[4]) / 6.0;
      const col = t[5];
      const c = [trunc(col[0] * alpha + 40), trunc(col[1] * alpha), trunc(col[2] * alpha)];
      g.line(c, trunc(t[0]) - ox, trunc(t[1]) - oy, trunc(t[2]) - ox, trunc(t[3]) - oy, 2);
    }

    for (const p of this.particles) {
      const px = trunc(p[0]) - ox;
      const py = trunc(p[1]) - oy;
      if (px > -20 && px < SCREEN_W + 20 && py > -20 && py < SCREEN_H + 20) g.circle(p[5], px, py, p[6]);
    }
  }

  // --------------------------------------------------
  drawHud() {
    const g = this.gfx;
    const p = this.player;
    const H = SCREEN_H;

    g.alphaRect(0, 0, 0, 150, 12, H - 108, 330, 96);
    g.rectOutline([110, 80, 40], 12, H - 108, 330, 96, 2);

    g.rect([60, 20, 20], 26, H - 96, 200, 16);
    const hcol = p.health > 50 ? [60, 200, 70] : (p.health > 25 ? [230, 180, 40] : [220, 50, 40]);
    g.rect(hcol, 26, H - 96, trunc(200 * (p.health / 100.0)), 16);
    g.rectOutline([150, 120, 80], 26, H - 96, 200, 16, 1);
    g.text('s', 'HEALTH ' + p.health, [240, 230, 210], 232, H - 97);

    g.rect([40, 40, 20], 26, H - 72, 200, 16);
    g.rect([220, 180, 60], 26, H - 72, Math.min(200, trunc(p.ammo * 4)), 16);
    g.rectOutline([150, 120, 80], 26, H - 72, 200, 16, 1);
    g.text('s', 'AMMO ' + p.ammo, [240, 230, 210], 232, H - 73);

    g.rect([20, 40, 60], 26, H - 48, 200, 16);
    const fw = trunc(200 * (p.fuel / p.maxFuel));
    const fcol = p.hasJet ? [80, 180, 240] : [70, 70, 80];
    g.rect(fcol, 26, H - 48, fw, 16);
    g.rectOutline([150, 120, 80], 26, H - 48, 200, 16, 1);
    g.text('s', 'FUEL ' + trunc(p.fuel) + '%', [240, 230, 210], 232, H - 49);

    let ix = 360;
    const iy = H - 104;
    if (p.hasJet) {
      g.roundRect([120, 120, 130], ix, iy, 26, 30, 4);
      g.polygon([255, 160, 40], [[ix + 13, iy + 34], [ix + 4, iy + 46], [ix + 22, iy + 46]]);
    }
    ix += 40;
    if (p.hasHook) {
      g.arc([190, 190, 200], ix, iy + 8, 26, 26, 0.6, 5.6, 4);
      g.circle([220, 220, 60], ix + 13, iy + 12, 5);
    }

    const wname = p.currentWeaponName();
    const wcol = (p.clubUpgraded && p.currentWeaponId() === 'club') ? [220, 60, 40] : [200, 200, 220];
    const wtxt = 'WEAPON: ' + wname;
    g.text('s', wtxt, wcol, 16, H - 22);
    if (p.weapons.length > 1) {
      g.text('s', '[ P ] SWITCH', [140, 130, 100], 16 + g.textWidth('s', wtxt) + 12, H - 22);
    }

    const tag = 'LV ' + (this.levelIndex + 1) + '/' + TOTAL_LEVELS;
    g.text('s', tag, [200, 180, 140], SCREEN_W - g.textWidth('s', tag) - 16, 16);
    const ktxt = 'KILLS: ' + p.kills;
    g.text('s', ktxt, [220, 200, 150], SCREEN_W - g.textWidth('s', ktxt) - 16, 38);

    if (!p.clubUpgraded) {
      const prog = Math.min(1.0, p.kills / 50.0);
      const bx = SCREEN_W - 130, by = 58;
      g.rect([40, 30, 24], bx, by, 114, 8);
      g.rect([200, 60, 40], bx, by, trunc(114 * prog), 8);
      g.rectOutline([120, 90, 60], bx, by, 114, 8, 1);
      const stxt = 'CHAINSAW ' + p.kills + '/50';
      g.text('s', stxt, [200, 180, 150], bx - g.textWidth('s', stxt) - 8, by - 2);
    }

    // ---- rover health bar (only while driving) ----
    if (p.vehicle !== null && !p.vehicle.exploded) {
      const rv = p.vehicle;
      const bw = 330, bx = 12, by = H - 130;
      g.rect([20, 20, 30], bx, by, bw, 18);
      const frac = Math.max(0.0, rv.hp / rv.maxhp);
      g.rect([70, 140, 200], bx + 2, by + 2, trunc((bw - 4) * frac), 14);
      g.rectOutline([150, 200, 240], bx, by, bw, 18, 2);
      g.text('s', 'ROVER ' + trunc(rv.hp) + '/' + rv.maxhp, [200, 230, 255], bx + bw + 8, by);
    }

    // ---- boss health bar ----
    const boss = this.enemies.find(e => e.kind === 'B');
    if (boss) {
      const bw = 600;
      const bx = (SCREEN_W >> 1) - (bw >> 1);
      const by = H - 152;
      g.rect([40, 0, 0], bx - 2, by - 2, bw + 4, 22);
      const frac = Math.max(0.0, boss.hp / boss.maxhp);
      g.rect([200, 30, 20], bx, by, trunc(bw * frac), 18);
      g.rectOutline([220, 170, 80], bx, by, bw, 18, 2);
      const btxt = 'T H E   O V E R S E E R';
      g.text('s', btxt, [255, 220, 160], bx + (bw >> 1) - (g.textWidth('s', btxt) >> 1), by - 22);
      const armN = this.enemies.filter(e => e.kind === 'H').length;
      const atxt = armN > 0 ? 'ARMS: ' + armN + '  (OPTIONAL)' : 'ARMS SEVERED';
      g.text('s', atxt, [220, 180, 140], bx + bw - g.textWidth('s', atxt), by + 22);
    }

    if (this.msgTimer > 0) {
      g.text('m', this.msg, [255, 220, 120], (SCREEN_W >> 1) - (g.textWidth('m', this.msg) >> 1), 24);
    }
  }

  // --------------------------------------------------
  drawCrosshair() {
    const g = this.gfx;
    const mx = trunc(this.input.mouse[0]), my = trunc(this.input.mouse[1]);
    const p = this.player;
    let col = [255, 230, 120];
    if (p !== null && p.currentWeaponId() === 'club') col = p.clubUpgraded ? [255, 120, 60] : [200, 200, 200];
    g.line(col, mx - 12, my, mx - 4, my, 2);
    g.line(col, mx + 4, my, mx + 12, my, 2);
    g.line(col, mx, my - 12, mx, my - 4, 2);
    g.line(col, mx, my + 4, mx, my + 12, 2);
    g.circle(col, mx, my, 2);
  }

  // --------------------------------------------------
  drawStart() {
    const g = this.gfx;
    g.fill([10, 6, 6]);
    for (let i = 0; i < SCREEN_H; i += 4) {
      const v = 20 + trunc(30 * (i / SCREEN_H));
      g.rect([v + 20, trunc(v / 3), v >> 2], 0, i, SCREEN_W, 4);
    }
    for (let i = SCREEN_H - 200; i < SCREEN_H; i++) {
      const a = (i - (SCREEN_H - 200)) / 200.0;
      g.rect([trunc(120 * a) + 20, trunc(30 * a), 0], 0, i, SCREEN_W, 1);
    }
    const tw = g.textWidth('xl', 'DOOM 2D');
    g.text('xl', 'DOOM 2D', [255, 120, 40], (SCREEN_W >> 1) - (tw >> 1) + 3, 88);
    g.text('xl', 'DOOM 2D', [200, 40, 30], (SCREEN_W >> 1) - (tw >> 1), 85);
    const sub = 'M A R S   D E M A K E   -   27  L E V E L S  O F  H E L L';
    g.text('m', sub, [200, 180, 150], (SCREEN_W >> 1) - (g.textWidth('m', sub) >> 1), 176);
    const lines = [
      'A / D  or  ARROWS   -   MOVE',
      'SPACE               -   JUMP',
      'MOUSE               -   AIM',
      'LEFT CLICK          -   FIRE  (hold for minigun / plasma)',
      'P                   -   SWITCH WEAPON',
      'RIGHT CLICK         -   GRAPPLE (level 3+)',
      'SHIFT               -   JETPACK (level 2+)',
      'W / S while hooked  -   REEL IN / OUT',
      'E                   -   ENTER / EXIT ROVER (level 7+)',
      'R                   -   RESTART LEVEL',
      '',
      'ARSENAL: SHOTGUN / CLUB / GRENADE LAUNCHER / MINIGUN /',
      '         SUPER SHOTGUN / RAILGUN / PLASMA RIFLE',
      'NEW WEAPONS UNLOCK AS YOU DESCEND   |   CLUB -> CHAINSAW AT 50 KILLS',
      'BEWARE: PINKY / LOST SOUL / HELL KNIGHT / SHOTGUNNER',
      "LV 27 ARENA:  DESTROY THE OVERSEER'S HEAD - ITS ARMS ARE OPTIONAL",
      'TYPE  27  QUICKLY  TO  WARP  TO  THE  OVERSEER',
      'PRESS  ENTER  TO  RIP  AND  TEAR',
    ];
    let y = 214;
    for (const ln of lines) {
      let col = [230, 220, 200];
      if (ln.startsWith('PRESS')) col = [255, 200, 60];
      if (ln.includes('ARSENAL') || ln.includes('UNLOCK') || ln.includes('CHAINSAW')) col = [220, 160, 90];
      if (ln.includes('BEWARE') || ln.includes('OVERSEER')) col = [230, 120, 100];
      if (ln.includes('ROVER')) col = [140, 200, 240];
      if (ln.includes('TYPE')) col = [140, 220, 160];
      if (ln) g.text('m', ln, col, (SCREEN_W >> 1) - (g.textWidth('m', ln) >> 1), y);
      y += 23;
    }
  }

  drawWin() {
    const g = this.gfx;
    g.fill([8, 4, 4]);
    for (let i = 0; i < SCREEN_H; i += 4) {
      const v = 30 + trunc(40 * (i / SCREEN_H));
      g.rect([v + 30, v >> 2, trunc(v / 6)], 0, i, SCREEN_W, 4);
    }
    const t1 = 'HELL  CLEARED';
    g.text('xl', t1, [255, 90, 30], (SCREEN_W >> 1) - (g.textWidth('xl', t1) >> 1), 180);
    const t2 = 'THE OVERSEER IS DEAD - ALL 27 LEVELS CLEARED';
    g.text('l', t2, [230, 210, 180], (SCREEN_W >> 1) - (g.textWidth('l', t2) >> 1), 300);
    const t3 = 'PRESS  ENTER  TO  RETURN  TO  THE  START';
    g.text('m', t3, [255, 200, 60], (SCREEN_W >> 1) - (g.textWidth('m', t3) >> 1), 400);
  }

  drawDead() {
    const g = this.gfx;
    g.alphaRect(120, 0, 0, 110, 0, 0, SCREEN_W, SCREEN_H);
    const t1 = 'YOU  DIED';
    g.text('xl', t1, [255, 40, 30], (SCREEN_W >> 1) - (g.textWidth('xl', t1) >> 1), 230);
    const t2 = 'PRESS  ENTER  TO  TRY  AGAIN';
    g.text('m', t2, [240, 220, 200], (SCREEN_W >> 1) - (g.textWidth('m', t2) >> 1), 350);
  }

  // --------------------------------------------------
  draw() {
    if (this.state === 'start') { this.drawStart(); return; }
    if (this.state === 'win') { this.drawWin(); return; }
    this.drawWorld();
    this.drawHud();
    this.drawCrosshair();
    if (this.state === 'dead') this.drawDead();
  }
}

// ============================================================
//  PROCEDURAL AUDIO SYNTHESIS
// ============================================================
const noise = () => Math.random() * 2.0 - 1.0;   // random.uniform(-1.0, 1.0)

function genShotgun(t) {
  const env = Math.exp(-t * 13.0);
  const n = noise();
  const thump = Math.sin(2.0 * Math.PI * 55.0 * t) * Math.exp(-t * 9.0);
  const crack = Math.sin(2.0 * Math.PI * 240.0 * t) * Math.exp(-t * 45.0);
  return (n * 0.80 + thump * 0.85 + crack * 0.5) * env;
}
function genSsg(t) {
  const env = Math.exp(-t * 9.0);
  const n = noise();
  const thump = Math.sin(2.0 * Math.PI * 42.0 * t) * Math.exp(-t * 6.0);
  const crack = Math.sin(2.0 * Math.PI * 190.0 * t) * Math.exp(-t * 30.0);
  return (n * 0.90 + thump * 1.0 + crack * 0.6) * env;
}
function genGrunt(t) {
  const env = Math.exp(-t * 3.2) * Math.min(1.0, t * 70.0);
  const f = 92.0 + 38.0 * Math.sin(2.0 * Math.PI * 11.0 * t);
  const saw = 2.0 * ((f * t) % 1.0) - 1.0;
  return (saw * 0.55 + Math.sin(2.0 * Math.PI * f * t) * 0.45) * env * 0.75;
}
function genJump(t) {
  const env = Math.exp(-t * 9.0);
  const f = 280.0 + 720.0 * t;
  return Math.sin(2.0 * Math.PI * f * t) * env * 0.5;
}
function genPickup(t) {
  const env = Math.exp(-t * 5.0);
  const f = t < 0.07 ? 700.0 : (t < 0.14 ? 1050.0 : 1400.0);
  return Math.sin(2.0 * Math.PI * f * t) * env * 0.45;
}
function genHurt(t) {
  const env = Math.exp(-t * 6.0);
  const f = 230.0 - 130.0 * t;
  const saw = 2.0 * ((f * t) % 1.0) - 1.0;
  return saw * env * 0.55;
}
function genBoom(t) {
  const env = Math.exp(-t * 5.0);
  const n = noise();
  const low = Math.sin(2.0 * Math.PI * 45.0 * t);
  return (n * 0.6 + low * 0.85) * env;
}
function genHook(t) {
  const env = Math.exp(-t * 15.0);
  const f = 880.0 + 520.0 * Math.sin(2.0 * Math.PI * 22.0 * t);
  return Math.sin(2.0 * Math.PI * f * t) * env * 0.35;
}
function genJet(t) {
  const env = Math.min(1.0, t * 40.0) * Math.exp(-t * 6.0);
  return noise() * env * 0.22;
}
function genSwing(t) {
  const env = Math.exp(-t * 12.0);
  const f = 160.0 + 500.0 * t;
  return Math.sin(2.0 * Math.PI * f * t) * env * 0.4;
}
function genChainsaw(t) {
  const env = Math.min(1.0, t * 30.0) * Math.exp(-t * 8.0);
  const f = 90.0 + 25.0 * Math.sin(2.0 * Math.PI * 40.0 * t);
  const saw = 2.0 * ((f * t) % 1.0) - 1.0;
  const n = noise() * 0.3;
  return (saw * 0.5 + n) * env * 0.5;
}
function genReload(t) {
  const env = Math.exp(-t * 10.0);
  const f = 500.0 - 200.0 * t;
  return Math.sin(2.0 * Math.PI * f * t) * env * 0.3;
}
function genClick(t) {
  const env = Math.exp(-t * 25.0);
  return Math.sin(2.0 * Math.PI * 1400.0 * t) * env * 0.4;
}
function genGrenade(t) {
  const env = Math.exp(-t * 16.0);
  const thump = Math.sin(2.0 * Math.PI * 70.0 * t) * Math.exp(-t * 10.0);
  return (noise() * 0.5 + thump * 0.9) * env;
}
function genRail(t) {
  const env = Math.exp(-t * 7.0);
  const f = 1800.0 - 1200.0 * t;
  return (Math.sin(2.0 * Math.PI * f * t) * 0.5 +
          noise() * 0.15 * Math.exp(-t * 20.0)) * env;
}
function genPlasma(t) {
  const env = Math.exp(-t * 10.0);
  const f = 900.0 - 400.0 * t;
  return Math.sin(2.0 * Math.PI * f * t) * env * 0.35;
}
function genMinigun(t) {
  const env = Math.exp(-t * 24.0);
  const crack = Math.sin(2.0 * Math.PI * 300.0 * t) * Math.exp(-t * 60.0);
  return (noise() * 0.4 + crack * 0.4) * env;
}

const SFX_SPECS = [
  ['shotgun', 0.42, genShotgun],
  ['ssg',     0.55, genSsg],
  ['grunt',   0.55, genGrunt],
  ['jump',    0.22, genJump],
  ['pickup',  0.30, genPickup],
  ['hurt',    0.35, genHurt],
  ['boom',    0.65, genBoom],
  ['hook',    0.20, genHook],
  ['jet',     0.18, genJet],
  ['swing',   0.20, genSwing],
  ['chainsaw',0.25, genChainsaw],
  ['reload',  0.25, genReload],
  ['click',   0.10, genClick],
  ['grenade', 0.40, genGrenade],
  ['rail',    0.50, genRail],
  ['plasma',  0.22, genPlasma],
  ['minigun', 0.14, genMinigun],
];

class GameAudio {
  constructor() {
    this.ctx = null;
    this.buffers = {};
    this.voiceEnds = [];
  }

  // Must run inside a user gesture (browsers block audio before one).
  unlock() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { return; }
    const ctx = this.ctx;
    this.sfxGain = ctx.createGain();
    this.sfxGain.gain.value = 1.0;
    this.sfxGain.connect(ctx.destination);
    this.buildSounds();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }

  buildSounds() {
    const ctx = this.ctx, sr = ctx.sampleRate;
    for (const [name, dur, gen] of SFX_SPECS) {
      const n = Math.max(1, trunc(sr * dur));
      const buf = ctx.createBuffer(1, n, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        let s = gen(i / sr);
        if (s > 1.0) s = 1.0; else if (s < -1.0) s = -1.0;
        data[i] = trunc(s * 30000) / 32768;
      }
      this.buffers[name] = buf;
    }
  }

  // pygame.mixer has 8 channels; a sound with no free channel is skipped.
  play(name) {
    const ctx = this.ctx;
    if (!ctx || ctx.state !== 'running') return;
    const buf = this.buffers[name];
    if (!buf) return;
    const now = ctx.currentTime;
    this.voiceEnds = this.voiceEnds.filter(t => t > now);
    if (this.voiceEnds.length >= 8) return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.sfxGain);
    src.start();
    this.voiceEnds.push(now + buf.duration);
  }
}

// ============================================================
//  INPUT  (pygame.key.get_pressed / mouse.get_pos / event queue)
// ============================================================
class Input {
  constructor() {
    this.keys = new Set();
    this.mouse = [SCREEN_W >> 1, SCREEN_H >> 1];
    this.mouseHeld = new Set();
    this.queue = [];
  }
  down(name) { return this.keys.has(name); }
}

const KEYMAP = {
  KeyA: 'a', KeyD: 'd', KeyW: 'w', KeyS: 's',
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  Space: 'space', ShiftLeft: 'lshift', ShiftRight: 'rshift',
  KeyP: 'p', KeyE: 'e', KeyR: 'r',
  Digit2: '2', Digit7: '7',
  Enter: 'return', NumpadEnter: 'return', Escape: 'escape',
};

// ============================================================
//  MAIN  (browser)
// ============================================================
function boot() {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('screen');
  const focusHint = document.getElementById('focus-hint');
  const ctx = canvas.getContext('2d', { alpha: false });

  const seed = (() => {
    try { return crypto.getRandomValues(new Uint32Array(1))[0] || 1; }
    catch (e) { return (Math.random() * 4294967295) >>> 0 || 1; }
  })();
  setGlobalRandom(new PyRandom(seed));

  const gfx = new Gfx(ctx);
  const input = new Input();
  const audio = new GameAudio();
  let game = null;

  // ---- sizing: canvas backing store at an integer multiple of 1024x640 ----
  let scale = 1, cssW = SCREEN_W, cssH = SCREEN_H, fixedScale = 0, maxScale = 3;
  function layout() {
    const availW = stage.clientWidth, availH = stage.clientHeight;
    cssW = Math.max(160, Math.min(availW, availH * SCREEN_W / SCREEN_H));
    cssH = cssW * SCREEN_H / SCREEN_W;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = window.devicePixelRatio || 1;
    const k = fixedScale || Math.min(maxScale, Math.max(1, Math.ceil(cssW * dpr / SCREEN_W - 0.05)));
    if (k !== scale || canvas.width !== SCREEN_W * k) {
      scale = k;
      canvas.width = SCREEN_W * k;
      canvas.height = SCREEN_H * k;
    }
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (game) game.draw();
  }
  window.addEventListener('resize', layout);
  new ResizeObserver(layout).observe(stage);

  // ---- input ----
  function toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return [(clientX - r.left) * SCREEN_W / r.width, (clientY - r.top) * SCREEN_H / r.height];
  }
  function trackMouse(e) {
    const [x, y] = toLogical(e.clientX, e.clientY);
    input.mouse = [trunc(x), trunc(y)];
  }

  let fsExitAt = -1e9;
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) fsExitAt = performance.now();
    setTimeout(layout, 50);
  });
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
    } catch (e) { /* optional */ }
  }

  window.addEventListener('keydown', (e) => {
    audio.unlock();
    const name = KEYMAP[e.code];
    if (e.code === 'KeyF' && !e.repeat && !e.metaKey && !e.ctrlKey) {
      toggleFullscreen();
      return;
    }
    if (!name) return;
    if (e.metaKey) return;                        // leave Cmd shortcuts to the browser
    e.preventDefault();
    if (name === 'escape' && (document.fullscreenElement || performance.now() - fsExitAt < 400)) return;
    input.keys.add(name);
    if (!e.repeat) input.queue.push({ type: 'keydown', key: name });
  });
  window.addEventListener('keyup', (e) => {
    const name = KEYMAP[e.code];
    if (name) input.keys.delete(name);
    if (e.key === 'Shift') { input.keys.delete('lshift'); input.keys.delete('rshift'); }
    if (e.key === 'Meta') input.keys.clear();     // macOS drops keyups while Cmd is held
  });

  // Mouse: left = pygame button 1, right (or Ctrl+click on a Mac) = button 3.
  const heldButtons = new Map();   // DOM button -> logical button
  window.addEventListener('mousedown', (e) => {
    audio.unlock();
    trackMouse(e);
    if (document.activeElement !== canvas) canvas.focus({ preventScroll: true });
    let b = 0;
    if (e.button === 0) b = e.ctrlKey ? 3 : 1;
    else if (e.button === 2) b = 3;
    if (!b) return;
    e.preventDefault();
    heldButtons.set(e.button, b);
    input.mouseHeld.add(b);
    input.queue.push({ type: 'mousedown', button: b });
  });
  window.addEventListener('mouseup', (e) => {
    trackMouse(e);
    const b = heldButtons.get(e.button);
    if (b === undefined) return;
    heldButtons.delete(e.button);
    input.mouseHeld.delete(b);
    input.queue.push({ type: 'mouseup', button: b });
  });
  window.addEventListener('mousemove', trackMouse);
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  function releaseAll() {
    input.keys.clear();
    input.mouseHeld.clear();
    for (const b of heldButtons.values()) input.queue.push({ type: 'mouseup', button: b });
    heldButtons.clear();
  }
  function updateFocusHint() {
    focusHint.hidden = document.hasFocus();
  }
  window.addEventListener('blur', () => { releaseAll(); updateFocusHint(); });
  window.addEventListener('focus', updateFocusHint);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  // ---- main loop: fixed 60 Hz simulation, like clock.tick(FPS) ----
  const STEP = 1000 / FPS;
  let last = performance.now(), acc = 0, running = true;
  // If a big Retina canvas can't hold 60 fps, render at a lower multiple.
  const slow = [];
  function watchSpeed(dt) {
    if (fixedScale || scale <= 1 || !game || game.state !== 'play' || document.hidden || !document.hasFocus()) return;
    slow.push(dt);
    if (slow.length < 120) return;
    const sorted = slow.slice().sort((a, b) => a - b);
    slow.length = 0;
    if (sorted[60] > 24) { maxScale = scale - 1; layout(); }
  }
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    let dt = now - last;
    last = now;
    watchSpeed(dt);
    if (dt > 250) dt = STEP;                    // tab was hidden: don't fast-forward
    acc += dt;
    if (acc > STEP - 2 && acc < STEP) acc = STEP; // one update per frame on 60 Hz screens
    let steps = 0;
    try {
      while (acc >= STEP && steps < 4) {
        if (steps === 0) {
          const evs = input.queue;
          input.queue = [];
          for (const ev of evs) game.handleEvent(ev);
        }
        game.update();
        acc -= STEP;
        steps++;
      }
      if (steps === 4) acc = 0;
      if (steps > 0) {
        game.draw();
        canvas.style.cursor = (game.state === 'play' || game.state === 'dead') ? 'none' : 'default';
      }
    } catch (err) {
      console.error(err);
    }
    updateFocusHint();
  }

  // ---- keep progress across live page updates ----
  function snapshot() {
    return {
      state: game.state, levelIndex: game.levelIndex,
      persist: JSON.parse(JSON.stringify(game.persist)),
      levelSeeds: game.levelSeeds.slice(),
    };
  }
  function start(data) {
    game = new Game({ gfx, input, audio });
    try {
      if (data && Array.isArray(data.levelSeeds) && data.levelSeeds.length === TOTAL_LEVELS) {
        game.levelSeeds = data.levelSeeds.slice();
        if (data.persist) game.persist = Object.assign(freshPersist(), data.persist);
        if ((data.state === 'play' || data.state === 'dead') && data.levelIndex >= 0 && data.levelIndex < TOTAL_LEVELS) {
          game.levelIndex = data.levelIndex;
          game.loadLevel(game.levelIndex);
          game.state = 'play';
        }
      }
    } catch (e) { game.state = 'start'; }
    try { window.claude?.hot?.snapshot?.(snapshot); } catch (e) { /* optional */ }
    layout();
    updateFocusHint();
    requestAnimationFrame((t) => { last = t; frame(t); });
  }

  // test hooks (used by automated checks; harmless otherwise)
  window.DOOM2D = {
    get game() { return game; }, gfx, input, audio,
    stop() { running = false; },
    setFixedScale(k) { fixedScale = k; layout(); },
    classes: { Game, Gfx, Input, PyRandom, setGlobalRandom, getGlobalRandom },
  };

  const fontsReady = (document.fonts && document.fonts.load)
    ? Promise.all(['s', 'm', 'l', 'xl'].map(k => document.fonts.load(FONTS[k].css, 'A'))).catch(() => {})
    : Promise.resolve();
  const timeout = new Promise(res => setTimeout(res, 1500));
  Promise.race([fontsReady, timeout]).then(() => {
    const hot = window.claude?.hot;
    if (hot?.ready) hot.ready(start);
    else start(hot?.data ?? {});
  });
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    SCREEN_W, SCREEN_H, TILE, TOTAL_LEVELS, PyRandom, setGlobalRandom, getGlobalRandom,
    Rect, Level, generateLevelData, generateBossArena, makeBgTexturePixels, moveAndCollide, pyRound,
    Gfx, Game, Input, Player, Enemy, Rover, Item, Bullet, PlayerShot, freshPersist, SPRITES, WEAPON_NAMES,
  };
} else if (typeof window !== 'undefined') {
  boot();
}

</script>
